<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3260" viewBox="0 0 1800 3260">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 44px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 23px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 4; rx: 24; }
      .decision { fill: #fff7ed; stroke: #ea580c; stroke-width: 4; }
      .success { fill: #ecfdf5; stroke: #059669; stroke-width: 4; rx: 24; }
      .block { fill: #fef2f2; stroke: #dc2626; stroke-width: 4; rx: 24; }
      .open { fill: #fffbeb; stroke: #d97706; stroke-width: 4; rx: 24; }
      .gap { fill: #fdf4ff; stroke: #a21caf; stroke-width: 4; rx: 24; }
      .label { font: 600 26px 'Segoe UI', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 500 21px 'Segoe UI', Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .edge { fill: none; stroke: #334155; stroke-width: 4; marker-end: url(#arrow); }
      .edge-label { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .note { font: 600 22px 'Segoe UI', Arial, sans-serif; fill: #7c2d12; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1800" height="2500" fill="#ffffff"/>
  <text x="900" y="65" class="title" text-anchor="middle">Paired Timesheet correction → Create Draft</text>
  <text x="900" y="105" class="subtitle" text-anchor="middle">Verified current policy flow; no automatic PAYE/Umbrella conversion and no invented replacement</text>

  <rect x="575" y="145" width="650" height="105" class="box"/>
  <text x="900" y="190" class="label"><tspan x="900">Imported Timesheet correction</tspan><tspan x="900" dy="34" class="small">Original/root identity remains explicit</tspan></text>
  <path d="M900 250 L900 300" class="edge"/>

  <polygon points="900,300 1110,390 900,480 690,390" class="decision"/>
  <text x="900" y="380" class="label"><tspan x="900">Declared correction</tspan><tspan x="900" dy="34">shape?</tspan></text>

  <path d="M690 390 L490 390 L490 520" class="edge"/>
  <text x="510" y="365" class="edge-label">Reversal + replacement</text>
  <rect x="120" y="520" width="740" height="145" class="box"/>
  <text x="490" y="565" class="label"><tspan x="490">Original + exactly one negative reversal</tspan><tspan x="490" dy="36">+ exactly one positive replacement</tspan><tspan x="490" dy="34" class="small">Both physical Timesheet IDs remain recorded</tspan></text>

  <path d="M1110 390 L1310 390 L1310 520" class="edge"/>
  <text x="1300" y="365" class="edge-label">Valid reversal-only</text>
  <rect x="940" y="520" width="740" height="145" class="box"/>
  <text x="1310" y="565" class="label"><tspan x="1310">Original + exactly one negative reversal</tspan><tspan x="1310" dy="36">No replacement is invented</tspan><tspan x="1310" dy="34" class="small">This must be explicitly declared REVERSAL_ONLY</tspan></text>

  <path d="M900 480 L900 710" class="edge"/>
  <text x="1120" y="460" class="edge-label">Missing/duplicate/unexpected member</text>
  <path d="M1110 455 L1580 455 L1580 710" class="edge"/>
  <rect x="1340" y="710" width="420" height="170" class="block"/>
  <text x="1550" y="765" class="label"><tspan x="1550">BLOCKED</tspan><tspan x="1550" dy="38" class="small">No Draft rows</tspan><tspan x="1550" dy="31" class="small">No money/provider effect</tspan></text>

  <path d="M490 665 L490 735 L760 735" class="edge"/>
  <path d="M1310 665 L1310 735 L1040 735" class="edge"/>
  <polygon points="900,685 1140,790 900,895 660,790" class="decision"/>
  <text x="900" y="755" class="label"><tspan x="900">Exact worker, client, operation,</tspan><tspan x="900" dy="34">member order and fingerprints?</tspan><tspan x="900" dy="34" class="small">No paid or invoice-locked conflict?</tspan></text>
  <path d="M1140 790 L1340 790" class="edge"/>
  <text x="1240" y="770" class="edge-label">No</text>
  <path d="M900 895 L900 955" class="edge"/>
  <text x="935" y="930" class="edge-label">Yes</text>

  <rect x="520" y="955" width="760" height="135" class="success"/>
  <text x="900" y="1000" class="label"><tspan x="900">One atomic correction unit</tspan><tspan x="900" dy="36" class="small">Action against either leg resolves all required members together</tspan><tspan x="900" dy="31" class="small">Each leg and component remains separately evidenced</tspan></text>
  <path d="M900 1090 L900 1145" class="edge"/>

  <polygon points="900,1145 1120,1230 900,1315 680,1230" class="decision"/>
  <text x="900" y="1218" class="label"><tspan x="900">Any unrelated overlapping</tspan><tspan x="900" dy="34">Timesheet?</tspan></text>
  <path d="M1120 1230 L1550 1230 L1550 880" class="edge"/>
  <text x="1220" y="1210" class="edge-label">Yes</text>
  <path d="M900 1315 L900 1370" class="edge"/>
  <text x="935" y="1350" class="edge-label">No</text>

  <rect x="500" y="1370" width="800" height="135" class="box"/>
  <text x="900" y="1415" class="label"><tspan x="900">Calculate every TS_DAY component residual</tspan><tspan x="900" dy="36" class="small">Existing truth − settled baseline − active reservations</tspan><tspan x="900" dy="31" class="small">No new arithmetic or policy</tspan></text>
  <path d="M900 1505 L900 1560" class="edge"/>

  <polygon points="900,1560 1150,1660 900,1760 650,1660" class="decision"/>
  <text x="900" y="1648" class="label"><tspan x="900">Historical source channel equals</tspan><tspan x="900" dy="34">worker's current channel?</tspan></text>
  <path d="M650 1660 L350 1660 L350 1805" class="edge"/>
  <text x="470" y="1635" class="edge-label">No: PAYE ↔ Umbrella</text>
  <rect x="60" y="1805" width="580" height="180" class="open"/>
  <text x="350" y="1850" class="label"><tspan x="350">ACTION REQUIRED</tspan><tspan x="350" dy="36" class="small">Resolve every component bucket separately</tspan><tspan x="350" dy="31" class="small">Exact saved target amounts + fingerprints</tspan><tspan x="350" dy="31" class="small">Partial/stale resolution stays blocked</tspan></text>
  <path d="M640 1895 L760 1895" class="edge"/>
  <text x="700" y="1875" class="edge-label">All exact</text>
  <path d="M350 1985 L350 2070 L1550 2070 L1550 880" class="edge"/>
  <text x="660" y="2045" class="edge-label">Missing, partial or stale → blocked</text>

  <path d="M900 1760 L900 1805" class="edge"/>
  <text x="935" y="1795" class="edge-label">Yes</text>
  <polygon points="900,1805 1050,1895 900,1985 750,1895" class="decision"/>
  <text x="900" y="1885" class="label"><tspan x="900">Net</tspan><tspan x="900" dy="34">residual?</tspan></text>

  <path d="M750 1895 L690 1895 L690 2150 L430 2150" class="edge"/>
  <text x="680" y="2125" class="edge-label">Positive</text>
  <rect x="60" y="2150" width="740" height="140" class="success"/>
  <text x="430" y="2195" class="label"><tspan x="430">One certified correction-family constituent</tspan><tspan x="430" dy="36" class="small">Ordered original/reversal/replacement lineage</tspan><tspan x="430" dy="31" class="small">Exact channel, sign, amount and fingerprints</tspan></text>

  <path d="M900 1985 L900 2150" class="edge"/>
  <text x="935" y="2070" class="edge-label">Zero</text>
  <rect x="825" y="2150" width="320" height="140" class="success"/>
  <text x="985" y="2200" class="label"><tspan x="985">Nothing payable</tspan><tspan x="985" dy="38" class="small">No item invented</tspan></text>

  <path d="M1050 1895 L1420 1895 L1420 2150" class="edge"/>
  <text x="1240" y="1875" class="edge-label">Negative</text>
  <rect x="1170" y="2150" width="570" height="140" class="open"/>
  <text x="1455" y="2190" class="label"><tspan x="1455">Existing recovery/headroom owner</tspan><tspan x="1455" dy="35" class="small">Signed residual is preserved—not made positive</tspan><tspan x="1455" dy="31" class="small">Zero headroom: retained, not selected</tspan></text>

  <path d="M430 2290 L430 2350 L900 2350" class="edge"/>
  <rect x="540" y="2320" width="720" height="135" class="success"/>
  <text x="900" y="2365" class="label"><tspan x="900">Draft freezes under Policy X</tspan><tspan x="900" dy="36" class="small">Existing allocation, PAYE/Umbrella, VAT and reservation owners</tspan><tspan x="900" dy="31" class="small">Retry cannot duplicate; later Workbench refresh cannot alter it</tspan></text>

  <text x="900" y="2550" class="title" text-anchor="middle">If correction members are deliberately removed</text>
  <text x="900" y="2590" class="subtitle" text-anchor="middle">Four different outcomes—never merge them or repair them inside Create Draft</text>

  <rect x="70" y="2640" width="800" height="210" class="success"/>
  <text x="470" y="2690" class="label"><tspan x="470">Keep negative reversal only</tspan><tspan x="470" dy="38" class="small">Valid user-confirmed outcome</tspan><tspan x="470" dy="31" class="small">Must be atomically republished upstream as genuine REVERSAL_ONLY</tspan><tspan x="470" dy="31" class="small">Then retained as existing overpayment-recovery authority</tspan></text>

  <rect x="930" y="2640" width="800" height="210" class="block"/>
  <text x="1330" y="2690" class="label"><tspan x="1330">Keep positive replacement only</tspan><tspan x="1330" dy="38" class="small">Strictly prohibited</tspan><tspan x="1330" dy="31" class="small">No reversal means the correction unit is invalid</tspan><tspan x="1330" dy="31" class="small">Fails closed with no Draft or money effect</tspan></text>

  <rect x="70" y="2900" width="800" height="210" class="success"/>
  <text x="470" y="2950" class="label"><tspan x="470">Remove the complete pair</tspan><tspan x="470" dy="38" class="small">Valid cancellation of the correction</tspan><tspan x="470" dy="31" class="small">Current delete owner targets both members together</tspan><tspan x="470" dy="31" class="small">Existing financial history may require archive instead of deletion</tspan></text>

  <rect x="930" y="2900" width="800" height="210" class="gap"/>
  <text x="1330" y="2950" class="label"><tspan x="1330">Current implementation gap</tspan><tspan x="1330" dy="38" class="small">Standard delete cannot yet remove only the replacement</tspan><tspan x="1330" dy="31" class="small">It currently treats changed-hours pairs as one two-row unit</tspan><tspan x="1330" dy="31" class="small">Do not weaken Draft validation to conceal this gap</tspan></text>
</svg>
