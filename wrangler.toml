# =========================
# CloudTMS - Wrangler config 
# Safe for test + prod from one repo - hello worldssss
# =========================
#
# IMPORTANT:
# - Deploy TEST with:        npx wrangler deploy --env test
# - Deploy PRODUCTION with:  npx wrangler deploy --env production
# - Default (no --env) deploys to a harmless local name (cloudtms-local)
#

name = "cloudtms-local"
main = "broker/src/index.js"
compatibility_date = "2025-10-13"
compatibility_flags = ["nodejs_compat"]

# Enable Workers Browser Rendering (shared)
[browser]
binding = "BROWSER"

# =========================
# Default vars (LOCAL ONLY)
# =========================
[vars]
# Safe defaults for local/dev. Real deploys should always use --env.
SUPABASE_URL = "https://yakevhtttcsljosbdpov.supabase.co"
ALLOWED_ORIGINS = "http://localhost:3000,https://kierarthur.github.io"
COOKIE_SAME_SITE = "None"
PRESIGN_EXPIRES_SECONDS = "600"
UPLOAD_MAX_BYTES = "300000"
