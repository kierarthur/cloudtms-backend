# =========================
# Triggers (LOCAL ONLY)
# =========================
[triggers]
# Keep empty locally unless you intentionally want crons in a dev deploy.
crons = []

# =========================
# Observability (shared)
# =========================
[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

