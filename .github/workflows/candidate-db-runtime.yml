permissions:
  contents: read

jobs:
  candidate-runtime:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['17.6', '18.1']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm and verify the approved toolchain
        run: |
          npm install --global npm@11.12.1
          npm run security:toolchain

      - name: Ensure PostgreSQL client is available
        timeout-minutes: 5
        run: |
          set -euo pipefail
          if command -v psql >/dev/null 2>&1; then
            psql --version
            exit 0
          fi

          sudo env DEBIAN_FRONTEND=noninteractive timeout 180s \
            apt-get update -qq \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30
          sudo env DEBIAN_FRONTEND=noninteractive timeout 180s \
            apt-get install -y -qq \
              -o Acquire::Retries=3 \
              postgresql-client
          psql --version

      - name: Install backend dependencies for real-chain verification
        run: npm ci --ignore-scripts --no-audit --no-fund --engine-strict

      - name: Verify the locked dependency authority
        run: npm run security:dependencies

      - name: Install Candidate authority and run all runtime suites
        shell: bash
        run: |
          set -euo pipefail
          apply_sql() {
            psql -X -v ON_ERROR_STOP=1 -q -f "$1"
          }

          apply_sql tests/fixtures/07082026_2155_candidate_app_local_compile_base.sql

