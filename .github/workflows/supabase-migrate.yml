name: Database source verification (no deploy)

on:
  push:
    branches: [main, test]
    paths:
      - "supabase/**"
      - "scripts/cloudtms-db-release*.mjs"
      - "tests/database-release-system.test.mjs"
      - "docs/DATABASE_RELEASE_BIBLE.md"
      - "AGENTS.md"
      - ".github/workflows/supabase-migrate.yml"
      - ".github/workflows/database-release.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/cloudtms-db-release*.mjs"
      - "tests/database-release-system.test.mjs"
      - "docs/DATABASE_RELEASE_BIBLE.md"
      - "AGENTS.md"
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: database-source-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-db-runtime:
    name: Candidate PostgreSQL runtime gate
    uses: ./.github/workflows/candidate-db-runtime.yml

  migrate:
    name: Verify immutable database release source
    needs: candidate-db-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - run: node --test tests/database-release-system.test.mjs
      - name: Verify retained catalogue and runtime authority artifacts
        shell: bash
        run: |
          test -f supabase/verification/verify_banking_pay_targeted_fast_route_certified_reuse_catalog.mjs
          test -f supabase/verification/verify_banking_pay_revision5_catalog.mjs
          test -f supabase/verification/verify_banking_pay_workbench_certified_source_preview_catalog.mjs
          test -f supabase/verification/verify_banking_pay_semantic_ready_cancellation_reversion_catalog.mjs
          test -f tests/13082026_1942_banking_pay_james_rate_authority_runtime_verification.sql
          test -f supabase/verification/22082026_1302_general_browser_isolation_verification.sql
          test -f supabase/verification/22082026_1402_candidate_named_legacy_security_verification.sql
          test -f supabase/verification/23082026_0400_candidate_named_security_verification_v2.sql
          test -f supabase/verification/22082026_0952_candidate_mytms_browser_isolation_verification.sql
      - name: Verify existing database and RPC source authorities
        run: npm test

  prove-no-deploy:
    name: Confirm this workflow has no database authority
    runs-on: ubuntu-latest
    steps:
      - run: echo "This workflow performs source checks only. Database releases require the manual protected Database Release workflow."
