name: Supabase Migrate (safe)

on:
  push:
    branches: [ "main", "test" ]
    paths:
      - "supabase/migrations/**"
      - "supabase/repeatable/**"
      - "supabase/verification/**"
      - "tests/banking-pay-revision5-final-authority.test.cjs"
      - "tests/banking-pay-legacy-monolith-authority-reassert.test.cjs"
      - ".github/workflows/supabase-migrate.yml"
  workflow_dispatch: {}

concurrency:
  group: supabase-migrate-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      # main -> live DB, test -> test DB
      DB_URL: ${{ github.ref_name == 'main' && secrets.SUPABASE_DB_URL || secrets.SUPABASE_DB_URL_TEST }}
      BEFORE_SHA: ${{ github.event.before || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify Banking Pay function source authority
        run: |
          node --test \
            tests/banking-pay-revision5-final-authority.test.cjs \
            tests/banking-pay-legacy-monolith-authority-reassert.test.cjs

      - name: Apply repeatables first, then migrations (UK date order)
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${DB_URL:-}" ]]; then
            echo "DB_URL is not set. Check GitHub secrets."
            exit 1
          fi

          MIG_DIR="supabase/migrations"
          REP_DIR="supabase/repeatable"

          test -d "$MIG_DIR" || { echo "Missing $MIG_DIR"; exit 1; }
          test -d "$REP_DIR" || { echo "Missing $REP_DIR"; exit 1; }

          echo "Running on branch: $GITHUB_REF_NAME"

          # 1) Ensure ledger exists
          psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q <<'SQL'
          create table if not exists public.schema_migrations (
            filename text primary key,
            applied_at timestamptz not null default now()
          );

          create table if not exists public.schema_repeatables (
            filename text primary key,
            content_sha256 text not null,
            applied_at timestamptz not null default now()
          );
          SQL

          # 2) Detect whether DB already has schema (bootstrap guard)
          EXISTING_PUBLIC_TABLES=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -X -tAc "
            select count(*)
            from pg_catalog.pg_tables
            where schemaname = 'public'
              and tablename not in ('schema_migrations', 'schema_repeatables')
          " | tr -d '[:space:]')

          echo "Existing public tables (excluding ledger): ${EXISTING_PUBLIC_TABLES}"

          apply_file () {
            local f="$1"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -f "$f"
          }

          record_name () {
            local name="$1"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -c \
              "insert into public.schema_migrations(filename) values ('$name') on conflict (filename) do nothing;"
          }

          record_migration () {
            local f="$1"
            local base
            base="$(basename "$f")"
            record_name "$base"
          }

          repeatable_hash () {
            sha256sum "$1" | awk '{print $1}'
          }

          record_repeatable_hash () {
            local base="$1"
            local content_hash="$2"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -c \
              "insert into public.schema_repeatables(filename, content_sha256, applied_at)
               values ('$base', '$content_hash', now())
               on conflict (filename) do update
               set content_sha256 = excluded.content_sha256,
                   applied_at = excluded.applied_at;"
          }

          # Build a sortable key from the filename:
          # - DDMMYYYY -> YYYYMMDD
          # - YYYYMMDD -> YYYYMMDD
          # - otherwise fallback after dated files using ZZZZZZZZ_
          sort_key_for_file () {
            local f="$1"
            local base
            base="$(basename "$f")"

            if [[ "$base" =~ ^([0-9]{2})([0-9]{2})([0-9]{4})(.*)$ ]]; then
              # UK format DDMMYYYY...
              printf '%s|%s\n' "${BASH_REMATCH[3]}${BASH_REMATCH[2]}${BASH_REMATCH[1]}${BASH_REMATCH[4]}" "$f"
            elif [[ "$base" =~ ^([0-9]{4})([0-9]{2})([0-9]{2})(.*)$ ]]; then
              # ISO-like format YYYYMMDD...
              printf '%s|%s\n' "${BASH_REMATCH[1]}${BASH_REMATCH[2]}${BASH_REMATCH[3]}${BASH_REMATCH[4]}" "$f"
            else
              # Undated files sort after dated files, alphabetically
              printf 'ZZZZZZZZ_%s|%s\n' "$base" "$f"
            fi
          }

          sorted_sql_files () {
            local dir="$1"
            local files=()
            local f

            shopt -s nullglob
            files=( "$dir"/*.sql )

            if [[ "${#files[@]}" -eq 0 ]]; then
              return 0
            fi

            for f in "${files[@]}"; do
              sort_key_for_file "$f"
            done | sort | cut -d'|' -f2-
          }

          # Gather migration files in UK date order
          mapfile -t MIG_FILES_SORTED < <(sorted_sql_files "$MIG_DIR")

          declare -A MIGRATION_LEDGER_NAMES=()
          LEDGER_COUNT=0
          while IFS= read -r migration_filename; do
            if [[ -n "${migration_filename}" ]]; then
              MIGRATION_LEDGER_NAMES["${migration_filename}"]="1"
              ((LEDGER_COUNT += 1))
            fi
          done < <(
            psql "$DB_URL" -v ON_ERROR_STOP=1 -X -tA -c "
              select filename
              from public.schema_migrations
              order by filename
            "
          )
          echo "Migration ledger rows: ${LEDGER_COUNT}"

          # 3) Bootstrap mode for migrations ledger only
          if [[ "${LEDGER_COUNT}" == "0" && "${EXISTING_PUBLIC_TABLES}" != "0" ]]; then
            echo "BOOTSTRAP: DB already populated; marking existing migrations as applied (no replay)."
            MIGRATION_BOOTSTRAP_SQL="$(mktemp)"
            printf 'begin;\n' > "${MIGRATION_BOOTSTRAP_SQL}"
            for f in "${MIG_FILES_SORTED[@]}"; do
              base="$(basename "$f")"
              printf \
                "insert into public.schema_migrations(filename, applied_at) values ('%s', now()) on conflict (filename) do nothing;\n" \
                "$base" >> "${MIGRATION_BOOTSTRAP_SQL}"
              MIGRATION_LEDGER_NAMES["${base}"]="1"
            done
            printf \
              "insert into public.schema_migrations(filename, applied_at) values ('__BOOTSTRAPPED__', now()) on conflict (filename) do nothing;\n" \
              >> "${MIGRATION_BOOTSTRAP_SQL}"
            printf 'commit;\n' >> "${MIGRATION_BOOTSTRAP_SQL}"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -f "${MIGRATION_BOOTSTRAP_SQL}"
            rm -f "${MIGRATION_BOOTSTRAP_SQL}"
            MIGRATION_LEDGER_NAMES["__BOOTSTRAPPED__"]="1"
          fi

          # 4) Apply only new or content-changed repeatables, in UK date order.
          # The hash is recorded only after a successful psql call, so a failed
          # repeatable remains pending and is retried on the next workflow run.
          echo "Applying new or changed repeatables first, in UK date order."
          mapfile -t REP_FILES_SORTED < <(sorted_sql_files "$REP_DIR")

          declare -A REPEATABLE_LEDGER_HASHES=()
          REPEATABLE_LEDGER_COUNT=0
          while IFS='|' read -r ledger_filename ledger_hash; do
            if [[ -n "${ledger_filename}" ]]; then
              REPEATABLE_LEDGER_HASHES["${ledger_filename}"]="${ledger_hash}"
              ((REPEATABLE_LEDGER_COUNT += 1))
            fi
          done < <(
            psql "$DB_URL" -v ON_ERROR_STOP=1 -X -tAF '|' -c "
              select filename, content_sha256
              from public.schema_repeatables
              order by filename
            "
          )

          BOOTSTRAP_EXISTING_REPEATABLES=false
          REPEATABLE_BOOTSTRAP_COMPLETE="${REPEATABLE_LEDGER_HASHES[__BOOTSTRAPPED__]:-}"
          if [[ "${REPEATABLE_BOOTSTRAP_COMPLETE}" != "v1" && "${EXISTING_PUBLIC_TABLES}" != "0" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" != "push" || -z "${BEFORE_SHA}" || "${BEFORE_SHA}" =~ ^0+$ ]]; then
              echo "Cannot safely bootstrap repeatable hashes for an existing database without a push base commit."
              exit 1
            fi
            BOOTSTRAP_EXISTING_REPEATABLES=true
            echo "BOOTSTRAP: recording unchanged existing repeatables and applying only files changed by this push."
          fi

          if [[ "${BOOTSTRAP_EXISTING_REPEATABLES}" == "true" ]]; then
            BOOTSTRAP_SQL="$(mktemp)"
            printf 'begin;\n' > "${BOOTSTRAP_SQL}"

            for f in "${REP_FILES_SORTED[@]}"; do
              base="$(basename "$f")"
              content_hash="$(repeatable_hash "$f")"

              if git diff --quiet "${BEFORE_SHA}" "${GITHUB_SHA}" -- "$f"; then
                printf \
                  "insert into public.schema_repeatables(filename, content_sha256, applied_at) values ('%s', '%s', now()) on conflict (filename) do update set content_sha256 = excluded.content_sha256, applied_at = excluded.applied_at;\n" \
                  "$base" "$content_hash" >> "${BOOTSTRAP_SQL}"
                REPEATABLE_LEDGER_HASHES["${base}"]="${content_hash}"
              fi
            done

            printf \
              "insert into public.schema_repeatables(filename, content_sha256, applied_at) values ('__BOOTSTRAPPED__', 'v1', now()) on conflict (filename) do update set content_sha256 = excluded.content_sha256, applied_at = excluded.applied_at;\n" \
              >> "${BOOTSTRAP_SQL}"
            printf 'commit;\n' >> "${BOOTSTRAP_SQL}"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -X -q -f "${BOOTSTRAP_SQL}"
            rm -f "${BOOTSTRAP_SQL}"
            REPEATABLE_LEDGER_HASHES["__BOOTSTRAPPED__"]="v1"
            REPEATABLE_BOOTSTRAP_COMPLETE="v1"
            echo "BASELINE complete for unchanged repeatables."
          fi

          for f in "${REP_FILES_SORTED[@]}"; do
            base="$(basename "$f")"
            content_hash="$(repeatable_hash "$f")"
            installed_hash="${REPEATABLE_LEDGER_HASHES[$base]:-}"

            if [[ "$installed_hash" == "$content_hash" ]]; then
              echo "SKIP unchanged repeatable: $base"
              continue
            fi

            echo "APPLY new/changed repeatable: $base"
            apply_file "$f"
            record_repeatable_hash "$base" "$content_hash"
            REPEATABLE_LEDGER_HASHES["${base}"]="${content_hash}"
          done

          if [[ "${REPEATABLE_BOOTSTRAP_COMPLETE}" != "v1" ]]; then
            record_repeatable_hash "__BOOTSTRAPPED__" "v1"
          fi

          # 5) Then apply one-time migrations, in UK date order
          echo "Applying one-time migrations after repeatables, in UK date order."
          for f in "${MIG_FILES_SORTED[@]}"; do
            base="$(basename "$f")"
            already="${MIGRATION_LEDGER_NAMES[$base]:-}"
            if [[ "$already" == "1" ]]; then
              echo "SKIP migration: $base"
            else
              echo "APPLY migration: $base"
              apply_file "$f"
              record_migration "$f"
              MIGRATION_LEDGER_NAMES["${base}"]="1"
            fi
          done

          node supabase/verification/verify_banking_pay_revision5_catalog.mjs
          node supabase/verification/verify_banking_pay_workbench_certified_source_preview_catalog.mjs
          node supabase/verification/verify_banking_pay_targeted_fast_route_certified_reuse_catalog.mjs

          echo "Done."
