name: Backend toolchain and dependency security

on:
  push:
    branches: [test]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24, npm 11 and zero high/critical findings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm 11
        run: npm install --global npm@11.12.1

      - name: Verify approved toolchain
        run: npm run security:toolchain

      - name: Install exact locked dependencies
        run: npm ci --engine-strict

      - name: Enforce dependency, credential and audit gates
        run: npm run security:verify

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > backend-sbom.cdx.json

      - name: Upload exact-commit SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cloudtms-backend-sbom-${{ github.sha }}
          path: backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
