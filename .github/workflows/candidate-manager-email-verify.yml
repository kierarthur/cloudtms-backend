name: Candidate manager email verification

on:
  push:
    branches: [test]
    paths:
      - "candidate-broker/**"
      - "candidate-private-api/**"
      - "candidate-synthetic-private-api/**"
      - "broker/src/candidate-**"
      - "broker/src/mytms-**"
      - "tests/candidate-**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/candidate-manager-email-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-manager-email-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Candidate and manager email source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify complete backend source
        run: npm test

      - name: Reject generated Candidate binding drift
        run: npm run candidate:bindings:check
