openapi: 3.1.0
info:
  title: CloudTMS Office Candidate API
  version: 1.0.0-test
  license: {name: ISC, identifier: ISC}
  description: >-
    Authenticated normal-CloudTMS office adapter for Candidate projections and
    lifecycle actions. This is not the public Candidate broker contract. Browser
    callers never call Candidate business RPCs directly. All state-changing
    operations use server-owned identities, generations and idempotency.
    During the TEST implementation phase this contract is deliberately enabled
    for authenticated CloudTMS office administrators; no separate frontend kill
    switch is introduced. Every route independently enforces the declared admin
    permission before calling the service-role adapter.
    Candidate client feature flags may remain false in TEST: they continue to
    block public Candidate sessions, while the authenticated Office adapter
    opens a transaction-scoped, single-action service authority receipt. A
    browser-supplied service marker is never sufficient.
servers:
  - url: https://test-cloudtms-backend.kier-88a.workers.dev
    description: Normal TEST backend only. Production is outside this contract.
security:
  - OfficeSession: []
tags:
  - {name: Capabilities, description: Office feature mode and permission gates.}
  - {name: Projection, description: Single and bounded multi-row Candidate projections.}
  - {name: Lifecycle, description: Typed Candidate lifecycle operations.}
  - {name: Paper, description: Immutable PAPER review and recovery operations.}
  - {name: Batch, description: Server-owned Tools reminder selection and batching.}
x-cloudtms-authority:
  audience: OFFICE
  normal_backend_only: true
  direct_browser_rpc: false
  candidate_broker: false
  public_candidate_client: false
  database_adapter: public.cloudtms_office_candidate_adapter_v1
  maximum_projection_rows: 100
  timesheet_summary_projection_transport: normal summary response
  timesheet_summary_after_render_hydration: false
  maximum_manager_reminder_batch_rows: 1000
  financial_calculation: forbidden
  candidate_client_business_rpc_count_change: 0
  session_authority: existing normal CloudTMS office authentication
  origin_policy: existing normal CloudTMS CORS and bearer-session policy
  candidate_tokens_valid: false
  candidate_app_sessions_valid: false
  direct_browser_service_role: false
  service_rpc_grants: service_role only
  batch_result_scope: initiating authenticated office actor
  required_office_role: admin
  permission_source: OFFICE_ADMIN_ROLE_V1
  office_service_context: CANDIDATE_OFFICE_SERVICE_CONTEXT_V1
  candidate_client_flags_required_for_office_actions: false
  candidate_client_flags_continue_to_block_candidate_sessions: true
paths:
  /api/candidate-app/office-capabilities:
    get:
      tags: [Capabilities]
      operationId: getOfficeCandidateCapabilities
      summary: Get Candidate office capabilities
      responses:
        '200': {description: 'Enabled office capability and permission contract', content: {application/json: {schema: {$ref: '#/components/schemas/Capabilities'}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/{timesheetId}/office-detail:
    get:
      tags: [Projection]
      operationId: getOfficeCandidateTimesheet
      summary: Get one Candidate office timesheet projection
      parameters:
        - {$ref: '#/components/parameters/TimesheetId'}
        - {name: expected_row_signature, in: query, required: false, schema: {type: string, maxLength: 256}}
      responses:
        '200': {$ref: '#/components/responses/Projection'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/office-projections:
    post:
      tags: [Projection]
      operationId: projectOfficeCandidateRows
      summary: Project a bounded set of office timesheet rows
      description: >-
        One bounded snapshot request. The browser must not fan out one request
        per row. The normal Timesheet Summary backend may compose these exact
        bounded projections into its own row response so Candidate Submission
        paints with the initial grid rather than through after-render hydration.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectionBatchRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/ProjectionBatch'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/{timesheetId}/route-preview:
    get:
      tags: [Lifecycle]
      operationId: previewOfficeTimesheetRouteAction
      summary: Preview an office route intervention
      parameters:
        - {$ref: '#/components/parameters/TimesheetId'}
        - {name: action, in: query, required: true, schema: {$ref: '#/components/schemas/RouteAction'}}
      responses:
        '200': {description: Route warning context including the W07 reject-versus-manual intervention_choice decision, content: {application/json: {schema: {$ref: '#/components/schemas/RoutePreview'}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/{timesheetId}/route-confirm:
    post:
      tags: [Lifecycle]
      operationId: confirmOfficeTimesheetRouteAction
      summary: Confirm an office route intervention
      parameters: [{$ref: '#/components/parameters/TimesheetId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RouteConfirmRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/{timesheetId}/reject-preview:
    get:
      tags: [Lifecycle]
      operationId: previewOfficeCandidateRejection
      summary: Preview Candidate submission rejection
      parameters: [{$ref: '#/components/parameters/TimesheetId'}]
      responses:
        '200': {description: Closed rejection decision and context digest, content: {application/json: {schema: {$ref: '#/components/schemas/RejectionPreview'}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/{timesheetId}/reject:
    post:
      tags: [Lifecycle]
      operationId: confirmOfficeCandidateRejection
      summary: Confirm Candidate submission rejection
      parameters: [{$ref: '#/components/parameters/TimesheetId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RejectionRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/workflows/{workflowId}/actions/{action}:
    post:
      tags: [Lifecycle]
      operationId: performOfficeCandidateWorkflowAction
      summary: Perform a typed Candidate workflow action
      description: >-
        The cancel action cancels only the exact current manager approval
        request and link. It does not cancel the Candidate claim. Immutable sent
        mail remains history and a provider handoff in progress blocks mutation.
        PAPER retry uses the caller UUID as the durable outer operation identity.
        A concurrent call may return transient RETRY_IN_PROGRESS, but exact
        lost-response replay after completion returns the stored READY,
        FAILED_RETRYABLE or FAILED_TERMINAL result without assembling twice.
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [remind, renew, cancel, cancel-manager-handoff, phone-review, phone-progress, phone-approve, phone-refuse, retry-finalisation, retry-paper-preparation]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowActionRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
        '202': {$ref: '#/components/responses/Mutation'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/workflows/{workflowId}/actions/reject-expense-category:
    post:
      tags: [Lifecycle]
      operationId: rejectOfficeCandidateExpenseCategory
      summary: Reject one Candidate expense category
      description: >-
        Rejects exactly one complete Mileage, Travel, Accommodation or Other
        category using the action and confirmation projected for that category.
        The action is available only for an eligible Candidate Electronic or QR
        record; ordinary Manual, imported and financially protected records do
        not receive this authority. A changed generation, component generation,
        category context or deletion scope fails without mutation as
        CANDIDATE_EXPENSE_CATEGORY_CONTEXT_CHANGED.
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OfficeExpenseCategoryRejectionRequest'}}}}
      responses:
        '200': {description: Durable category rejection and exact Timesheet reconciliation receipt., content: {application/json: {schema: {$ref: '#/components/schemas/OfficeExpenseCategoryRejectionResultV2'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {description: CANDIDATE_EXPENSE_CATEGORY_CONTEXT_CHANGED. The projected category or deletion context changed; no mutation occurred., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/manager-reminder-eligibility:
    get:
      tags: [Batch]
      operationId: listOfficeManagerReminderEligibility
      summary: List the current server-owned manager-reminder eligibility catalogue
      description: >-
        Returns only EMAIL manager-approval requests whose exact current Office
        action is SEND_MANAGER_REMINDER and enabled. The catalogue revision
        freezes an all-pages selection; browser filters and browser-supplied row
        collections are not eligibility authority.
      parameters:
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {name: catalogue_revision, in: query, required: false, schema: {$ref: '#/components/schemas/Sha256'}}
        - {name: surname_query, in: query, required: false, description: Case-insensitive Candidate-surname substring filter., schema: {type: string, maxLength: 100}}
        - {name: sort_by, in: query, required: false, schema: {type: string, enum: [CANDIDATE_SURNAME, LAST_MANAGER_EMAIL], default: CANDIDATE_SURNAME}}
        - {name: sort_direction, in: query, required: false, schema: {type: string, enum: [ASC, DESC], default: ASC}}
      responses:
        '200': {$ref: '#/components/responses/ReminderEligibilityPage'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/manager-reminder-batches/preview:
    post:
      tags: [Batch]
      operationId: previewOfficeManagerReminderBatch
      summary: Preview a Tools manager-reminder selection
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReminderBatchPreviewRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/ReminderBatchPreview'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/manager-reminder-batches:
    post:
      tags: [Batch]
      operationId: executeOfficeManagerReminderBatch
      summary: Execute a Tools manager-reminder selection
      description: >-
        One server-owned operation. All-pages selections are resolved and
        revalidated against the catalogue revision; per-row browser reminder
        requests are prohibited. Exact lost-response replay is resolved from the
        durable batch receipt before current eligibility is recalculated.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReminderBatchExecuteRequest'}}}}
      responses:
        '202': {$ref: '#/components/responses/ReminderBatchResult'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/manager-reminder-batches/{batchId}:
    get:
      tags: [Batch]
      operationId: getOfficeManagerReminderBatch
      summary: Get a Tools manager-reminder batch result
      parameters: [{$ref: '#/components/parameters/BatchId'}]
      responses:
        '200': {$ref: '#/components/responses/ReminderBatchResult'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/workflows/{workflowId}/paper-pack:
    get:
      tags: [Paper]
      operationId: downloadOfficeCandidatePaperPack
      summary: Download the exact Candidate PAPER pack
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/Generation'}
      responses:
        '200': {$ref: '#/components/responses/Pdf'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/workflows/{workflowId}/paper-return-review:
    get:
      tags: [Paper]
      operationId: getOfficeCandidatePaperReturnReview
      summary: Get the exact Candidate PAPER return review
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/Generation'}
      responses:
        '200': {description: Exact manifest and returned-component review context, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/workflows/{workflowId}/components/{componentId}/document:
    get:
      tags: [Paper]
      operationId: downloadOfficeCandidateComponent
      summary: Download one immutable Candidate component
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/ComponentId'}
        - {$ref: '#/components/parameters/Generation'}
      responses:
        '200': {description: Immutable image or PDF bytes, content: {application/pdf: {schema: {type: string, format: binary}}, image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/workflows/{workflowId}/signature/prepare:
    post:
      tags: [Paper]
      operationId: prepareOfficeCandidateSignatureUpload
      summary: Prepare an office signature upload
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [generation, approval_request_id, approval_request_generation, idempotency_key, media_type, byte_size], properties: {generation: {type: integer, minimum: 1}, approval_request_id: {$ref: '#/components/schemas/Uuid'}, approval_request_generation: {type: integer, minimum: 1}, idempotency_key: {$ref: '#/components/schemas/Uuid'}, media_type: {type: string, enum: [image/png, image/jpeg]}, byte_size: {type: integer, minimum: 1}}}}}}
      responses:
        '201': {description: Encrypted upload ticket; no storage key is exposed, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/uploads/{ticket}:
    put:
      tags: [Paper]
      operationId: uploadOfficeCandidateSignature
      summary: Upload the exact prepared office signature bytes
      description: The encrypted, expiring ticket binds the authenticated office actor, workflow, generation, component identity, media type, byte size and private storage identity. No storage key is exposed.
      parameters:
        - name: ticket
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
      responses:
        '200': {description: Immutable signature component completion receipt, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    OfficeSession:
      type: http
      scheme: bearer
      bearerFormat: CloudTMS office session
      description: Normal CloudTMS authenticated office session. Candidate and manager tokens are rejected.
  parameters:
    TimesheetId: {name: timesheetId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    WorkflowId: {name: workflowId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ComponentId: {name: componentId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    BatchId: {name: batchId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    Generation: {name: generation, in: query, required: true, schema: {type: integer, minimum: 1}}
  schemas:
    Uuid: {type: string, format: uuid}
    Sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    OfficeExpenseCategoryName:
      type: string
      enum: [MILEAGE, TRAVEL, ACCOMMODATION, OTHER]
    OfficeExpenseCategoryRejectionReasonInput:
      type: object
      additionalProperties: false
      required: [name, type, required, max_length]
      properties:
        name: {const: reason_note}
        type: {const: string}
        required: {const: true}
        max_length: {const: 1000}
    OfficeExpenseCategoryRejectionAction:
      type: object
      additionalProperties: false
      required: [contract_version, code, label, group, prominent, enabled, disabled_reason_code, disabled_reason, requires_confirmation, requires_reason, invocation]
      properties:
        contract_version: {const: OFFICE_CANDIDATE_ACTION_V1}
        code: {const: REJECT_EXPENSE_CATEGORY}
        label: {const: 'Reject expense'}
        group: {const: EXPENSES}
        prominent: {const: false}
        enabled: {const: true}
        disabled_reason_code: {type: 'null'}
        disabled_reason: {type: 'null'}
        requires_confirmation: {const: true}
        requires_reason: {const: true}
        invocation:
          type: object
          additionalProperties: false
          required: [version, kind, method, path, fixed_body, required_user_inputs, idempotency]
          properties:
            version: {const: 1}
            kind: {const: HTTP}
            method: {const: POST}
            path:
              type: string
              pattern: '^/api/candidate-app/workflows/[0-9a-fA-F-]{36}/actions/reject-expense-category$'
            fixed_body:
              type: object
              additionalProperties: false
              required: [generation, expense_component_id, component_generation, confirmation_sha256]
              properties:
                generation: {type: integer, minimum: 1}
                expense_component_id: {$ref: '#/components/schemas/Uuid'}
                component_generation: {type: integer, minimum: 1}
                confirmation_sha256: {$ref: '#/components/schemas/Sha256'}
            required_user_inputs:
              type: array
              minItems: 1
              maxItems: 1
              items: {$ref: '#/components/schemas/OfficeExpenseCategoryRejectionReasonInput'}
            idempotency: {const: REQUIRED}
    OfficeEmptyTimesheetConsequence:
      type: string
      enum: [NONE, PERMANENT_REMOVE, REMOVE_FROM_CURRENT_KEEP_HISTORY]
      description: >-
        Exact consequence for the owning Timesheet after the complete category is
        rejected. PERMANENT_REMOVE is a physical deletion;
        REMOVE_FROM_CURRENT_KEEP_HISTORY removes it from current Office records
        while preserving the Timesheet in History.
    OfficeExpenseCategoryRejectionConfirmation:
      type: object
      additionalProperties: false
      required: [contract_version, confirmation_sha256, expense_category, amount, mileage_units, supporting_evidence_count, owning_timesheet_id, empty_timesheet_consequence, will_delete_timesheet, remaining_hours, remaining_expense_total, route_family]
      properties:
        contract_version: {const: OFFICE_EXPENSE_CATEGORY_REJECTION_CONFIRMATION_V1}
        confirmation_sha256: {$ref: '#/components/schemas/Sha256'}
        expense_category: {$ref: '#/components/schemas/OfficeExpenseCategoryName'}
        amount: {type: number, minimum: 0}
        mileage_units: {type: number, minimum: 0}
        supporting_evidence_count: {type: integer, minimum: 0}
        owning_timesheet_id: {$ref: '#/components/schemas/Uuid'}
        empty_timesheet_consequence: {$ref: '#/components/schemas/OfficeEmptyTimesheetConsequence'}
        will_delete_timesheet: {type: boolean}
        remaining_hours: {type: number, minimum: 0}
        remaining_expense_total: {type: number, minimum: 0}
        route_family: {type: string, enum: [ELECTRONIC, QR]}
    OfficeExpenseCategory:
      type: object
      additionalProperties: true
      description: >-
        The two Office rejection siblings are both null when the category is not
        eligible and are both present when rejection is available. They never
        expose Candidate-side whole-claim, withdrawal or replacement authority.
      required: [expense_component_id, component_generation, expense_category, amount, mileage_units, supporting_evidence_count, owning_timesheet_id, office_rejection_action, office_rejection_confirmation]
      properties:
        expense_component_id: {$ref: '#/components/schemas/Uuid'}
        component_generation: {type: integer, minimum: 1}
        expense_category: {$ref: '#/components/schemas/OfficeExpenseCategoryName'}
        amount: {type: number, minimum: 0}
        mileage_units: {type: number, minimum: 0}
        supporting_evidence_count: {type: integer, minimum: 0}
        owning_timesheet_id: {$ref: '#/components/schemas/Uuid'}
        office_rejection_action:
          oneOf: [{$ref: '#/components/schemas/OfficeExpenseCategoryRejectionAction'}, {type: 'null'}]
        office_rejection_confirmation:
          oneOf: [{$ref: '#/components/schemas/OfficeExpenseCategoryRejectionConfirmation'}, {type: 'null'}]
    OfficeExpenseClaim:
      type: object
      additionalProperties: true
      required: [workflow_id, generation, categories]
      properties:
        workflow_id: {$ref: '#/components/schemas/Uuid'}
        generation: {type: integer, minimum: 1}
        categories: {type: array, items: {$ref: '#/components/schemas/OfficeExpenseCategory'}}
    OfficeExpenseCategoryRejectionRequest:
      type: object
      additionalProperties: false
      required: [generation, expense_component_id, component_generation, confirmation_sha256, reason_note, idempotency_key]
      properties:
        generation: {type: integer, minimum: 1}
        expense_component_id: {$ref: '#/components/schemas/Uuid'}
        component_generation: {type: integer, minimum: 1}
        confirmation_sha256: {$ref: '#/components/schemas/Sha256'}
        reason_note: {type: string, minLength: 1, maxLength: 1000}
        idempotency_key: {$ref: '#/components/schemas/Uuid'}
    OfficeExpenseCategoryRejectionRefusal:
      type: object
      additionalProperties: false
      required: [kind, reason, at_utc]
      properties:
        kind: {const: AGENCY_REJECTION}
        reason: {type: string, minLength: 1, maxLength: 1000}
        at_utc: {type: string, format: date-time}
    OfficeExpenseCategoryRejectionRefreshHints:
      type: object
      additionalProperties: false
      required: [summary, simple_timesheet, bulk_process, bulk_authorise, refetch]
      properties:
        summary: {const: true}
        simple_timesheet: {const: true}
        bulk_process: {const: true}
        bulk_authorise: {const: true}
        refetch: {const: AFFECTED_ROWS}
    OfficeExpenseCategoryRejectionResultV2:
      type: object
      additionalProperties: false
      required: [ok, contract_version, operation_id, action_code, workflow_id, expense_component_id, component_generation, state, refusal, previous_owning_timesheet_id, empty_timesheet_consequence, owning_timesheet_deleted, deleted_timesheet_ids, retained_timesheet_ids, affected_timesheet_ids, removed_from_current_timesheet_ids, refresh_timesheet_ids, refresh_hints, idempotent_replay]
      properties:
        ok: {const: true}
        contract_version: {const: OFFICE_EXPENSE_CATEGORY_REJECTION_RESULT_V2}
        operation_id: {$ref: '#/components/schemas/Uuid'}
        action_code: {const: REJECT_EXPENSE_CATEGORY}
        workflow_id: {$ref: '#/components/schemas/Uuid'}
        expense_component_id: {$ref: '#/components/schemas/Uuid'}
        component_generation:
          type: integer
          minimum: 1
          description: Authoritative post-rejection generation; it is not the request precondition generation.
        state: {const: OFFICE_REJECTED}
        refusal: {$ref: '#/components/schemas/OfficeExpenseCategoryRejectionRefusal'}
        previous_owning_timesheet_id: {$ref: '#/components/schemas/Uuid'}
        empty_timesheet_consequence: {$ref: '#/components/schemas/OfficeEmptyTimesheetConsequence'}
        owning_timesheet_deleted: {type: boolean}
        deleted_timesheet_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        retained_timesheet_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        affected_timesheet_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        removed_from_current_timesheet_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        refresh_timesheet_ids: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        refresh_hints: {$ref: '#/components/schemas/OfficeExpenseCategoryRejectionRefreshHints'}
        idempotent_replay: {type: boolean}
    Surface:
      type: string
      enum: [SIMPLE_TIMESHEET, TIMESHEET_SUMMARY, BULK_PROCESS, BULK_AUTHORISE, INVOICE_GENERATOR, INVOICE_ISSUER]
    RouteAction:
      type: string
      enum: [SWITCH_TO_MANUAL, SWITCH_DAILY_TO_MANUAL, CONVERT_QR_TO_MANUAL, ALLOW_ELECTRONIC_AGAIN, ALLOW_QR_AGAIN, DISABLE_QR, INVALIDATE_QR, REISSUE_QR]
    Identity:
      type: object
      description: >-
        Exact Office row identity. DAILY Candidate rows are timesheet/booking-family
        owned and are requested by timesheet_id without a contract_week_id. WEEKLY
        rows retain their exact timesheet plus contract-week identity. Mixed or
        ambiguous identities fail closed.
      additionalProperties: false
      required: [row_key]
      properties:
        row_key: {type: string, minLength: 1, maxLength: 256}
        timesheet_id: {$ref: '#/components/schemas/Uuid'}
        contract_week_id: {$ref: '#/components/schemas/Uuid'}
        expected_row_signature: {type: [string, 'null'], maxLength: 256}
    Capabilities:
      type: object
      additionalProperties: true
      required: [ok, contract_version, capabilities_version, office_contract_version, authority_applies, mode, required_office_role, permission_source, surfaces, permissions]
      properties:
        ok: {const: true}
        contract_version: {const: CLOUDTMS_OFFICE_CANDIDATE_API_V1}
        capabilities_version: {const: OFFICE_CANDIDATE_CAPABILITIES_V1}
        office_contract_version: {const: CLOUDTMS_OFFICE_CANDIDATE_API_V1}
        projection_version: {const: OFFICE_CANDIDATE_TIMESHEET_V1}
        typed_action_version: {const: 1}
        batch_version: {const: OFFICE_CANDIDATE_REMINDER_BATCH_V1}
        authority_applies: {type: boolean}
        mode: {type: string, const: ENABLED}
        required_office_role: {type: string, const: admin}
        permission_source: {type: string, const: OFFICE_ADMIN_ROLE_V1}
        surfaces:
          type: object
          additionalProperties: false
          required: [timesheet_summary, simple_timesheet, bulk_process, bulk_authorise, invoice_generator, invoice_issuer]
          properties:
            timesheet_summary: {type: boolean}
            simple_timesheet: {type: boolean}
            bulk_process: {type: boolean}
            bulk_authorise: {type: boolean}
            invoice_generator: {type: boolean}
            invoice_issuer: {type: boolean}
        permissions:
          type: object
          additionalProperties: false
          required: [view_candidate_state, change_route, reject_submission, resubmit_rejected, send_manager_reminder, send_manager_reminder_batch, renew_manager_request, cancel_manager_request, manage_phone_approval, manage_paper, retry_finalisation, mark_no_work]
          properties:
            view_candidate_state: {type: boolean}
            change_route: {type: boolean}
            reject_submission: {type: boolean}
            resubmit_rejected: {type: boolean}
            send_manager_reminder: {type: boolean}
            send_manager_reminder_batch: {type: boolean}
            renew_manager_request: {type: boolean}
            cancel_manager_request: {type: boolean}
            manage_phone_approval: {type: boolean}
            manage_paper: {type: boolean}
            retry_finalisation: {type: boolean}
            mark_no_work: {type: boolean}
    ProjectionBatchRequest:
      type: object
      additionalProperties: false
      required: [surface, selected_rows]
      properties:
        surface: {$ref: '#/components/schemas/Surface'}
        selected_rows: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/Identity'}}
    Projection:
      type: object
      additionalProperties: true
      required: [ok, contract_version, office_contract_version, observed_at_utc, current_identity, candidate_status, available_actions, diagnostics, refresh_hints]
      properties:
        ok: {const: true}
        contract_version: {const: OFFICE_CANDIDATE_TIMESHEET_V1}
        office_contract_version: {const: CLOUDTMS_OFFICE_CANDIDATE_API_V1}
        observed_at_utc: {type: string, format: date-time}
        current_identity:
          type: object
          additionalProperties: true
          description: >-
            Canonical current identity. contract_week_id is null for a DAILY
            timesheet-owned row and present for a WEEKLY contract-week-owned row.
          properties:
            route_family:
              description: Present as ELECTRONIC or QR only when the expense projection has one unambiguous eligible route family.
              type: [string, 'null']
              enum: [ELECTRONIC, QR, null]
        candidate_status:
          type: object
          additionalProperties: true
          description: >-
            Server source status. Financial completion alone is not proof of a
            completed Candidate submission; Office presentation requires an
            applicable ELECTRONIC or QR route and durable Candidate workflow truth.
        workflow: {$ref: '#/components/schemas/WorkflowProjection'}
        manager_approval: {type: [object, 'null'], additionalProperties: true}
        retained_manager_approval: {$ref: '#/components/schemas/RetainedManagerApproval'}
        paper_pack: {$ref: '#/components/schemas/PaperPack'}
        rejections: {type: array, items: {$ref: '#/components/schemas/RejectionHistory'}}
        expense_claims: {type: array, items: {$ref: '#/components/schemas/OfficeExpenseClaim'}}
        available_actions: {type: array, items: {$ref: '#/components/schemas/TypedAction'}}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        refresh_hints: {$ref: '#/components/schemas/RefreshHints'}
    TypedAction:
      type: object
      additionalProperties: false
      required: [contract_version, code, label, group, enabled, invocation]
      properties:
        contract_version: {const: OFFICE_CANDIDATE_ACTION_V1}
        code: {type: string}
        label: {type: string}
        group: {type: string}
        prominent: {type: boolean}
        enabled: {type: boolean}
        disabled_reason_code: {type: [string, 'null']}
        disabled_reason: {type: [string, 'null']}
        requires_confirmation: {type: boolean}
        requires_reason: {type: boolean}
        invocation:
          type: object
          additionalProperties: false
          required: [version, kind, method, path, fixed_body, required_user_inputs, idempotency]
          properties:
            version: {const: 1}
            kind: {type: string, enum: [HTTP, CLIENT_DESTINATION]}
            method: {type: [string, 'null'], enum: [GET, POST, null]}
            path: {type: string}
            fixed_body: {type: object}
            required_user_inputs: {type: array, items: {type: object}}
            idempotency: {type: string, enum: [NONE, REQUIRED]}
    Diagnostic:
      type: object
      additionalProperties: true
      required: [code, severity, message, calculation_effect]
      properties:
        code: {type: string, enum: [EXPENSE_EMAIL_MISSING]}
        severity: {type: string, enum: [INFO, WARNING, ERROR]}
        message: {type: string}
        calculation_effect: {const: NONE}
    RefreshHints:
      type: object
      additionalProperties: true
      properties:
        refetch: {type: string, enum: [NONE, CURRENT_ROW, AFFECTED_ROWS, CURRENT_SURFACE]}
    PaperPack:
      type: object
      additionalProperties: true
      required: [state]
      properties:
        state: {type: string, enum: [NOT_APPLICABLE, PREPARING, BACKOFF, READY, RETURN_RECEIVED, FAILED_RETRYABLE, FAILED_TERMINAL, RETIRED, STALE]}
        lifecycle_code: {type: [string, 'null']}
        delivery_generation:
          type: [integer, 'null']
          minimum: 1
          description: Immutable PAPER delivery generation. FINALISED workflows use the preceding generation; live preparation uses the current generation.
        page_count: {type: [integer, 'null'], minimum: 1}
        reason_code: {type: [string, 'null']}
        failure_scope: {type: [string, 'null'], enum: [WORKFLOW, OUTBOX, null]}
        retryable: {type: boolean}
        retry_in_progress: {type: boolean}
        attempt_count: {type: integer, minimum: 0}
        next_retry_at_utc: {type: [string, 'null'], format: date-time}
        operation_id: {type: [string, 'null']}
        issued_at_utc: {type: [string, 'null'], format: date-time}
        returned_at_utc: {type: [string, 'null'], format: date-time}
    WorkflowProjection:
      type: [object, 'null']
      additionalProperties: true
      properties:
        workflow_id: {$ref: '#/components/schemas/Uuid'}
        generation: {type: integer, minimum: 1}
        state: {type: string}
        workflow_kind: {type: string}
        route: {type: string}
        approval_method: {type: [string, 'null']}
        is_current_action_workflow:
          type: boolean
          description: True only for the shared Candidate active/recoverable state catalogue.
        historical:
          type: boolean
          description: Terminal workflow history is returned for audit but never drives current status.
    RetainedManagerApproval:
      description: >-
        Exact manager-approved submission lineage retained by the current
        Timesheet when a different, later Candidate workflow is active. This
        preserves separate accepted lineage only when another workflow legitimately
        owns the same materialised Timesheet. An unfinished standalone expense claim
        has no Timesheet yet and is not projected onto the worked Timesheet row.
      type: [object, 'null']
      additionalProperties: false
      required: [workflow_id, workflow_generation, current_generation, workflow_kind, scope, route, state, method, approved_at_utc]
      properties:
        workflow_id: {$ref: '#/components/schemas/Uuid'}
        workflow_generation: {type: integer, minimum: 1}
        current_generation: {type: integer, minimum: 1}
        workflow_kind: {type: string, enum: [CONTRACT_HOURS, CONTRACT_EXPENSE, CONTRACT_COMBINED, DAILY]}
        scope: {type: string, enum: [HOURS, EXPENSE, COMBINED]}
        route: {type: string, enum: [ELECTRONIC, PHONE, EMAIL, PAPER]}
        state: {type: string}
        method: {type: string, enum: [PHONE, EMAIL]}
        approved_at_utc: {type: string, format: date-time}
    RejectionHistory:
      type: object
      additionalProperties: true
      required: [workflow_id, workflow_generation, state, rejection_actionable]
      properties:
        workflow_id: {$ref: '#/components/schemas/Uuid'}
        workflow_generation: {type: integer, minimum: 1}
        state: {type: string, enum: [REFUSED, REJECTED]}
        rejection_actionable: {type: boolean}
        replacement_workflow_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        replacement_state: {type: [string, 'null']}
        recovery_action:
          description: Null once durable direct replacement lineage exists.
          oneOf: [{$ref: '#/components/schemas/TypedAction'}, {type: 'null'}]
    RoutePreview:
      type: object
      additionalProperties: true
      properties:
        intervention_choice:
          type: [object, 'null']
          additionalProperties: false
          required: [required, decision_code, title, message, reject_available, reject_action, continue_action]
          properties:
            required: {const: true}
            decision_code: {const: REJECT_OR_MANUAL}
            title: {const: 'Does the candidate need to resubmit instead?'}
            message: {type: string}
            reject_available: {type: boolean}
            reject_disabled_reason_code: {type: [string, 'null']}
            reject_disabled_reason: {type: [string, 'null']}
            reject_action:
              type: object
              additionalProperties: false
              required: [code, label, method, path]
              properties:
                code: {const: REJECT_CANDIDATE_SUBMISSION}
                label: {const: 'Use Reject Candidate Submission'}
                method: {const: GET}
                path: {type: string}
            continue_action:
              type: object
              additionalProperties: false
              required: [code, label, method, path, fixed_body]
              properties:
                code: {const: CONTINUE_ROUTE_CHANGE}
                label: {const: 'Continue to Manual conversion'}
                method: {const: POST}
                path: {type: string}
                fixed_body:
                  type: object
                  additionalProperties: false
                  required: [action]
                  properties:
                    action: {$ref: '#/components/schemas/RouteAction'}
    RouteConfirmRequest:
      type: object
      additionalProperties: false
      required: [expected_timesheet_id, expected_row_signature, expected_context_sha256, action, idempotency_key]
      properties:
        expected_timesheet_id: {$ref: '#/components/schemas/Uuid'}
        expected_row_signature: {type: string}
        expected_context_sha256: {$ref: '#/components/schemas/Sha256'}
        action: {$ref: '#/components/schemas/RouteAction'}
        reason_code: {type: [string, 'null']}
        reason_note: {type: [string, 'null'], maxLength: 1000}
        allow_manual_only: {type: boolean, default: false}
        idempotency_key: {$ref: '#/components/schemas/Uuid'}
    RejectionPreview:
      type: object
      additionalProperties: true
      required: [contract_version, permitted, context_sha256, expected_timesheet_id, expected_row_signature]
      properties:
        contract_version: {const: OFFICE_CANDIDATE_REJECTION_PREVIEW_V1}
        permitted: {type: boolean}
        context_sha256: {$ref: '#/components/schemas/Sha256'}
        expected_timesheet_id: {$ref: '#/components/schemas/Uuid'}
        expected_row_signature: {type: string}
    RejectionRequest:
      type: object
      additionalProperties: false
      required: [expected_timesheet_id, expected_row_signature, context_sha256, reason, idempotency_key]
      properties:
        expected_timesheet_id: {$ref: '#/components/schemas/Uuid'}
        expected_row_signature: {type: string}
        context_sha256: {$ref: '#/components/schemas/Sha256'}
        reason: {type: string, minLength: 1, maxLength: 1000}
        idempotency_key: {$ref: '#/components/schemas/Uuid'}
    WorkflowActionRequest:
      type: object
      additionalProperties: false
      required: [generation, idempotency_key]
      properties:
        generation: {type: integer, minimum: 1}
        approval_request_id: {$ref: '#/components/schemas/Uuid'}
        approval_request_generation: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}
        reason_note: {type: string, minLength: 1, maxLength: 1000}
        reason_code: {type: string}
        manifest_sha256_hex: {$ref: '#/components/schemas/Sha256'}
        component_id: {$ref: '#/components/schemas/Uuid'}
        component_sha256_hex: {$ref: '#/components/schemas/Sha256'}
        viewed_receipt: {type: object, additionalProperties: true}
        manager_name: {type: string, minLength: 1, maxLength: 200}
        manager_position: {type: string, minLength: 1, maxLength: 200}
        signature_component_id: {$ref: '#/components/schemas/Uuid'}
        idempotency_key: {$ref: '#/components/schemas/Uuid'}
    ReminderEligibilityItem:
      type: object
      additionalProperties: false
      required: [selection_key, candidate_name, candidate_surname, last_manager_email_at_utc, identity]
      properties:
        selection_key: {$ref: '#/components/schemas/Uuid'}
        candidate_name: {type: string, minLength: 1, maxLength: 300}
        candidate_surname: {type: string, minLength: 1, maxLength: 200}
        last_manager_email_at_utc: {type: string, format: date-time}
        identity: {$ref: '#/components/schemas/Identity'}
    ReminderEligibilityPage:
      type: object
      additionalProperties: false
      required: [ok, contract_version, observed_at_utc, catalogue_revision, page, page_size, page_count, total_items, catalogue_total_items, surname_query, sort_by, sort_direction, matching_selection_keys, items]
      properties:
        ok: {const: true}
        contract_version: {const: OFFICE_CANDIDATE_REMINDER_ELIGIBILITY_PAGE_V1}
        observed_at_utc: {type: string, format: date-time}
        catalogue_revision: {$ref: '#/components/schemas/Sha256'}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        page_count: {type: integer, minimum: 0}
        total_items: {type: integer, minimum: 0, maximum: 1000}
        catalogue_total_items: {type: integer, minimum: 0, maximum: 1000}
        surname_query: {type: string, maxLength: 100}
        sort_by: {type: string, enum: [CANDIDATE_SURNAME, LAST_MANAGER_EMAIL]}
        sort_direction: {type: string, enum: [ASC, DESC]}
        matching_selection_keys: {type: array, maxItems: 1000, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ReminderEligibilityItem'}}
    ReminderSelection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, included_row_keys, excluded_row_keys]
          properties:
            mode: {const: EXPLICIT}
            included_row_keys: {type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
            excluded_row_keys: {type: array, maxItems: 0}
        - type: object
          additionalProperties: false
          required: [mode, included_row_keys, excluded_row_keys]
          properties:
            mode: {const: ALL_ELIGIBLE}
            included_row_keys: {type: array, maxItems: 0}
            excluded_row_keys: {type: array, maxItems: 1000, uniqueItems: true, items: {$ref: '#/components/schemas/Uuid'}}
    ReminderBatchPreviewRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [selected_rows]
          properties:
            selected_rows: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/Identity'}}
        - type: object
          additionalProperties: false
          required: [catalogue_revision, selection]
          properties:
            catalogue_revision: {$ref: '#/components/schemas/Sha256'}
            selection: {$ref: '#/components/schemas/ReminderSelection'}
    ReminderBatchExecuteRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [selected_rows, batch_id, idempotency_key, preview_context_hash, selection_fingerprint]
          properties:
            selected_rows: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/Identity'}}
            batch_id: {$ref: '#/components/schemas/Uuid'}
            idempotency_key: {$ref: '#/components/schemas/Uuid'}
            preview_context_hash: {$ref: '#/components/schemas/Sha256'}
            selection_fingerprint: {$ref: '#/components/schemas/Sha256'}
        - type: object
          additionalProperties: false
          required: [catalogue_revision, selection, selected_rows, batch_id, idempotency_key, preview_context_hash, selection_fingerprint]
          properties:
            catalogue_revision: {$ref: '#/components/schemas/Sha256'}
            selection: {$ref: '#/components/schemas/ReminderSelection'}
            selected_rows: {type: array, minItems: 1, maxItems: 1000, items: {$ref: '#/components/schemas/Identity'}}
            batch_id: {$ref: '#/components/schemas/Uuid'}
            idempotency_key: {$ref: '#/components/schemas/Uuid'}
            preview_context_hash: {$ref: '#/components/schemas/Sha256'}
            selection_fingerprint: {$ref: '#/components/schemas/Sha256'}
    ReminderBatchPreview:
      type: object
      additionalProperties: true
      required: [ok, contract_version, preview_context_hash, selection_fingerprint, selected_count, items]
      properties:
        ok: {const: true}
        contract_version: {const: OFFICE_CANDIDATE_REMINDER_BATCH_PREVIEW_V1}
        preview_context_hash: {$ref: '#/components/schemas/Sha256'}
        selection_fingerprint: {$ref: '#/components/schemas/Sha256'}
        selected_count: {type: integer, minimum: 1, maximum: 1000}
        selected_rows: {type: array, minItems: 1, maxItems: 1000, items: {$ref: '#/components/schemas/Identity'}}
        items: {type: array, maxItems: 1000, items: {type: object, additionalProperties: true}}
    ReminderBatchResult:
      type: object
      additionalProperties: true
      description: A durable batch result. PARTIAL and FAILED describe per-item outcomes and are successful retrievals of authoritative batch truth, not transport failures.
      required: [ok, contract_version, batch_id, status, success_count, failure_count, skipped_count, items]
      properties:
        ok: {const: true, description: "True once the batch outcome has been durably completed, including PARTIAL or FAILED item outcomes."}
        contract_version: {const: OFFICE_CANDIDATE_REMINDER_BATCH_RESULT_V1}
        batch_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, enum: [COMPLETED, PARTIAL, FAILED]}
        success_count: {type: integer, minimum: 0}
        failure_count: {type: integer, minimum: 0}
        skipped_count: {type: integer, minimum: 0}
        items: {type: array, maxItems: 1000, items: {type: object, additionalProperties: true}}
    Mutation:
      type: object
      additionalProperties: true
      properties:
        contract_version: {type: string, enum: [OFFICE_CANDIDATE_MUTATION_RESULT_V1]}
        affected_rows: {type: array, items: {type: object, additionalProperties: true}}
        refresh_hints: {$ref: '#/components/schemas/RefreshHints'}
    Error:
      type: object
      additionalProperties: false
      required: [ok, error_code, message, retryable, request_id]
      properties:
        ok: {const: false}
        error_code: {$ref: '#/components/schemas/OfficeErrorCode'}
        message: {type: string}
        retryable: {type: boolean}
        request_id: {type: string}
        details: {}
    OfficeErrorCode:
      type: string
      description: Stable office-facing code. The normal backend maps lower-level lifecycle aliases into this catalogue without changing the public Candidate contract.
      x-stable-codes:
        - OFFICE_AUTH_REQUIRED
        - CANDIDATE_OFFICE_PERMISSION_DENIED
        - CANDIDATE_OFFICE_PROJECTION_NOT_FOUND
        - CANDIDATE_OFFICE_PROJECTION_IDENTITY_INVALID
        - CANDIDATE_CONTEXT_STALE
        - CANDIDATE_TIMESHEET_MOVED
        - CANDIDATE_ACTION_NOT_ELIGIBLE
        - CANDIDATE_EXPENSE_CATEGORY_CONTEXT_CHANGED
        - CANDIDATE_REASON_REQUIRED
        - CANDIDATE_REASON_INVALID
        - CANDIDATE_REQUEST_GENERATION_STALE
        - CANDIDATE_REQUIRES_UNAUTHORISE
        - CANDIDATE_PROTECTED_FINANCIAL_HISTORY
        - CANDIDATE_IMPORT_AUTHORITATIVE
        - CANDIDATE_PROVIDER_HANDOFF_IN_PROGRESS
        - CANDIDATE_PAPER_SHARED_SOURCE_WORKFLOW_CONFLICT
        - CANDIDATE_TOO_MANY_AFFECTED_WORKFLOWS
        - CANDIDATE_REJECTION_SCOPE_CONFLICT
        - CANDIDATE_IDEMPOTENCY_CONFLICT
        - CANDIDATE_PAPER_OUTBOX_NOT_READY
        - CANDIDATE_PAPER_PACK_RETRY_NOT_READY
        - CANDIDATE_PAPER_PACK_ASSEMBLY_TRANSIENT
        - CANDIDATE_PAPER_PACK_FAILURE_RECEIPT_INVALID
        - CANDIDATE_REMINDER_CATALOGUE_TOO_LARGE
        - CANDIDATE_REMINDER_CATALOGUE_UNAVAILABLE
        - CANDIDATE_REMINDER_CATALOGUE_PAGE_INVALID
        - CANDIDATE_REMINDER_BATCH_SELECTION_INVALID
        - CANDIDATE_REMINDER_BATCH_SELECTION_CHANGED
        - CANDIDATE_REMINDER_BATCH_NOT_FOUND
        - CANDIDATE_ROUTE_NOT_FOUND
        - METHOD_NOT_ALLOWED
  responses:
    Projection: {description: Exact one-row Candidate office projection, content: {application/json: {schema: {$ref: '#/components/schemas/Projection'}}}}
    ProjectionBatch: {description: Bounded per-row projection snapshot, content: {application/json: {schema: {type: object, additionalProperties: true, required: [ok, contract_version, surface, observed_at_utc, result_count, results], properties: {ok: {const: true}, contract_version: {const: OFFICE_CANDIDATE_PROJECTION_BATCH_V1}, surface: {$ref: '#/components/schemas/Surface'}, observed_at_utc: {type: string, format: date-time}, result_count: {type: integer, minimum: 0, maximum: 100}, results: {type: array, maxItems: 100, items: {type: object, additionalProperties: true}}}}}}}
    Mutation: {description: Mutation result with exact affected rows and refetch instructions, content: {application/json: {schema: {$ref: '#/components/schemas/Mutation'}}}}
    ReminderEligibilityPage: {description: Eligible-only server-owned reminder catalogue page, content: {application/json: {schema: {$ref: '#/components/schemas/ReminderEligibilityPage'}}}}
    ReminderBatchPreview: {description: Immutable selection fingerprint and per-row eligibility, content: {application/json: {schema: {$ref: '#/components/schemas/ReminderBatchPreview'}}}}
    ReminderBatchResult: {description: Durable batch receipt with isolated per-row outcome, content: {application/json: {schema: {$ref: '#/components/schemas/ReminderBatchResult'}}}}
    Pdf: {description: Immutable PDF bytes, content: {application/pdf: {schema: {type: string, format: binary}}}}
    Error: {description: Stable office error envelope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
