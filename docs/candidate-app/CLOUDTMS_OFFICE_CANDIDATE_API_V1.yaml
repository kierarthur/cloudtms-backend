openapi: 3.1.0
info:
  title: CloudTMS Office Candidate API
  version: 1.0.0-test
  license: {name: ISC, identifier: ISC}
  description: >-
    Authenticated normal-CloudTMS office adapter for Candidate projections and
    lifecycle actions. This is not the public Candidate broker contract. Browser
    callers never call Candidate business RPCs directly. All state-changing
    operations use server-owned identities, generations and idempotency.
servers:
  - url: https://test-cloudtms-backend.kier-88a.workers.dev
    description: Normal TEST backend only. Production is outside this contract.
security:
  - OfficeSession: []
tags:
  - {name: Capabilities, description: Office feature mode and permission gates.}
  - {name: Projection, description: Single and bounded multi-row Candidate projections.}
  - {name: Lifecycle, description: Typed Candidate lifecycle operations.}
  - {name: Paper, description: Immutable PAPER review and recovery operations.}
  - {name: Batch, description: Server-owned Summary reminder batching.}
x-cloudtms-authority:
  audience: OFFICE
  normal_backend_only: true
  direct_browser_rpc: false
  candidate_broker: false
  public_candidate_client: false
  database_adapter: public.cloudtms_office_candidate_adapter_v1
  maximum_projection_rows: 100
  financial_calculation: forbidden
  candidate_client_business_rpc_count_change: 0
  session_authority: existing normal CloudTMS office authentication
  origin_policy: existing normal CloudTMS CORS and bearer-session policy
  candidate_tokens_valid: false
  candidate_app_sessions_valid: false
  direct_browser_service_role: false
  service_rpc_grants: service_role only
  batch_result_scope: initiating authenticated office actor
paths:
  /api/candidate-app/office-capabilities:
    get:
      tags: [Capabilities]
      operationId: getOfficeCandidateCapabilities
      summary: Get Candidate office capabilities
      responses:
        '200': {description: 'Enabled office capability and permission contract', content: {application/json: {schema: {$ref: '#/components/schemas/Capabilities'}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/{timesheetId}/office-detail:
    get:
      tags: [Projection]
      operationId: getOfficeCandidateTimesheet
      summary: Get one Candidate office timesheet projection
      parameters:
        - {$ref: '#/components/parameters/TimesheetId'}
        - {name: expected_row_signature, in: query, required: false, schema: {type: string, maxLength: 256}}
      responses:
        '200': {$ref: '#/components/responses/Projection'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/office-projections:
    post:
      tags: [Projection]
      operationId: projectOfficeCandidateRows
      summary: Project a bounded set of office timesheet rows
      description: One bounded snapshot request. The browser must not fan out one request per row.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectionBatchRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/ProjectionBatch'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/{timesheetId}/route-preview:
    get:
      tags: [Lifecycle]
      operationId: previewOfficeTimesheetRouteAction
      summary: Preview an office route intervention
      parameters:
        - {$ref: '#/components/parameters/TimesheetId'}
        - {name: action, in: query, required: true, schema: {$ref: '#/components/schemas/RouteAction'}}
      responses:
        '200': {description: Route warning context including the W07 reject-versus-manual intervention_choice decision, content: {application/json: {schema: {$ref: '#/components/schemas/RoutePreview'}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/{timesheetId}/route-confirm:
    post:
      tags: [Lifecycle]
      operationId: confirmOfficeTimesheetRouteAction
      summary: Confirm an office route intervention
      parameters: [{$ref: '#/components/parameters/TimesheetId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RouteConfirmRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/{timesheetId}/reject-preview:
    get:
      tags: [Lifecycle]
      operationId: previewOfficeCandidateRejection
      summary: Preview Candidate submission rejection
      parameters: [{$ref: '#/components/parameters/TimesheetId'}]
      responses:
        '200': {description: Closed rejection decision and context digest, content: {application/json: {schema: {$ref: '#/components/schemas/RejectionPreview'}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/timesheets/{timesheetId}/reject:
    post:
      tags: [Lifecycle]
      operationId: confirmOfficeCandidateRejection
      summary: Confirm Candidate submission rejection
      parameters: [{$ref: '#/components/parameters/TimesheetId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RejectionRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/workflows/{workflowId}/actions/{action}:
    post:
      tags: [Lifecycle]
      operationId: performOfficeCandidateWorkflowAction
      summary: Perform a typed Candidate workflow action
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [remind, renew, cancel, cancel-manager-handoff, phone-review, phone-progress, phone-approve, phone-refuse, retry-finalisation, retry-paper-preparation]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkflowActionRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/Mutation'}
        '202': {$ref: '#/components/responses/Mutation'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/manager-reminder-batches/preview:
    post:
      tags: [Batch]
      operationId: previewOfficeManagerReminderBatch
      summary: Preview a Summary manager-reminder batch
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReminderBatchPreviewRequest'}}}}
      responses:
        '200': {$ref: '#/components/responses/ReminderBatchPreview'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/manager-reminder-batches:
    post:
      tags: [Batch]
      operationId: executeOfficeManagerReminderBatch
      summary: Execute a Summary manager-reminder batch
      description: One server-owned operation; per-row browser reminder requests are prohibited.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReminderBatchExecuteRequest'}}}}
      responses:
        '202': {$ref: '#/components/responses/ReminderBatchResult'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/manager-reminder-batches/{batchId}:
    get:
      tags: [Batch]
      operationId: getOfficeManagerReminderBatch
      summary: Get a Summary manager-reminder batch result
      parameters: [{$ref: '#/components/parameters/BatchId'}]
      responses:
        '200': {$ref: '#/components/responses/ReminderBatchResult'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/workflows/{workflowId}/paper-pack:
    get:
      tags: [Paper]
      operationId: downloadOfficeCandidatePaperPack
      summary: Download the exact Candidate PAPER pack
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/Generation'}
      responses:
        '200': {$ref: '#/components/responses/Pdf'}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/workflows/{workflowId}/paper-return-review:
    get:
      tags: [Paper]
      operationId: getOfficeCandidatePaperReturnReview
      summary: Get the exact Candidate PAPER return review
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/Generation'}
      responses:
        '200': {description: Exact manifest and returned-component review context, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/workflows/{workflowId}/components/{componentId}/document:
    get:
      tags: [Paper]
      operationId: downloadOfficeCandidateComponent
      summary: Download one immutable Candidate component
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/ComponentId'}
        - {$ref: '#/components/parameters/Generation'}
      responses:
        '200': {description: Immutable image or PDF bytes, content: {application/pdf: {schema: {type: string, format: binary}}, image/png: {schema: {type: string, format: binary}}, image/jpeg: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/workflows/{workflowId}/signature/prepare:
    post:
      tags: [Paper]
      operationId: prepareOfficeCandidateSignatureUpload
      summary: Prepare an office signature upload
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [generation, approval_request_id, approval_request_generation, idempotency_key, media_type, byte_size], properties: {generation: {type: integer, minimum: 1}, approval_request_id: {$ref: '#/components/schemas/Uuid'}, approval_request_generation: {type: integer, minimum: 1}, idempotency_key: {$ref: '#/components/schemas/Uuid'}, media_type: {type: string, enum: [image/png, image/jpeg]}, byte_size: {type: integer, minimum: 1}}}}}}
      responses:
        '201': {description: Encrypted upload ticket; no storage key is exposed, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/candidate-app/uploads/{ticket}:
    put:
      tags: [Paper]
      operationId: uploadOfficeCandidateSignature
      summary: Upload the exact prepared office signature bytes
      description: The encrypted, expiring ticket binds the authenticated office actor, workflow, generation, component identity, media type, byte size and private storage identity. No storage key is exposed.
      parameters:
        - name: ticket
          in: path
          required: true
          schema: {type: string, minLength: 1}
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, format: binary}}
          image/jpeg: {schema: {type: string, format: binary}}
      responses:
        '200': {description: Immutable signature component completion receipt, content: {application/json: {schema: {type: object, additionalProperties: true}}}}
        '401': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    OfficeSession:
      type: http
      scheme: bearer
      bearerFormat: CloudTMS office session
      description: Normal CloudTMS authenticated office session. Candidate and manager tokens are rejected.
  parameters:
    TimesheetId: {name: timesheetId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    WorkflowId: {name: workflowId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ComponentId: {name: componentId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    BatchId: {name: batchId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    Generation: {name: generation, in: query, required: true, schema: {type: integer, minimum: 1}}
  schemas:
    Uuid: {type: string, format: uuid}
    Sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
    Surface:
      type: string
      enum: [SIMPLE_TIMESHEET, TIMESHEET_SUMMARY, BULK_PROCESS, BULK_AUTHORISE, INVOICE_GENERATOR, INVOICE_ISSUER]
    RouteAction:
      type: string
      enum: [SWITCH_TO_MANUAL, SWITCH_DAILY_TO_MANUAL, CONVERT_QR_TO_MANUAL, DISABLE_QR, INVALIDATE_QR, REISSUE_QR]
    Identity:
      type: object
      additionalProperties: false
      required: [row_key]
      properties:
        row_key: {type: string, minLength: 1, maxLength: 256}
        timesheet_id: {$ref: '#/components/schemas/Uuid'}
        contract_week_id: {$ref: '#/components/schemas/Uuid'}
        expected_row_signature: {type: [string, 'null'], maxLength: 256}
    Capabilities:
      type: object
      additionalProperties: true
      required: [ok, contract_version, capabilities_version, office_contract_version, authority_applies, mode, surfaces, permissions]
      properties:
        ok: {const: true}
        contract_version: {const: CLOUDTMS_OFFICE_CANDIDATE_API_V1}
        capabilities_version: {const: OFFICE_CANDIDATE_CAPABILITIES_V1}
        office_contract_version: {const: CLOUDTMS_OFFICE_CANDIDATE_API_V1}
        projection_version: {const: OFFICE_CANDIDATE_TIMESHEET_V1}
        typed_action_version: {const: 1}
        batch_version: {const: OFFICE_CANDIDATE_REMINDER_BATCH_V1}
        authority_applies: {type: boolean}
        mode: {type: string, const: ENABLED}
        surfaces:
          type: object
          additionalProperties: false
          required: [timesheet_summary, simple_timesheet, bulk_process, bulk_authorise, invoice_generator, invoice_issuer]
          properties:
            timesheet_summary: {type: boolean}
            simple_timesheet: {type: boolean}
            bulk_process: {type: boolean}
            bulk_authorise: {type: boolean}
            invoice_generator: {type: boolean}
            invoice_issuer: {type: boolean}
        permissions:
          type: object
          additionalProperties: false
          required: [view_candidate_state, change_route, reject_submission, resubmit_rejected, send_manager_reminder, send_manager_reminder_batch, renew_manager_request, cancel_manager_request, manage_phone_approval, manage_paper, retry_finalisation, mark_no_work]
          properties:
            view_candidate_state: {type: boolean}
            change_route: {type: boolean}
            reject_submission: {type: boolean}
            resubmit_rejected: {type: boolean}
            send_manager_reminder: {type: boolean}
            send_manager_reminder_batch: {type: boolean}
            renew_manager_request: {type: boolean}
            cancel_manager_request: {type: boolean}
            manage_phone_approval: {type: boolean}
            manage_paper: {type: boolean}
            retry_finalisation: {type: boolean}
            mark_no_work: {type: boolean}
    ProjectionBatchRequest:
      type: object
      additionalProperties: false
      required: [surface, selected_rows]
      properties:
        surface: {$ref: '#/components/schemas/Surface'}
        selected_rows: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/Identity'}}
    Projection:
      type: object
      additionalProperties: true
      required: [ok, contract_version, office_contract_version, observed_at_utc, current_identity, candidate_status, available_actions, diagnostics, refresh_hints]
      properties:
        ok: {const: true}
        contract_version: {const: OFFICE_CANDIDATE_TIMESHEET_V1}
        office_contract_version: {const: CLOUDTMS_OFFICE_CANDIDATE_API_V1}
        observed_at_utc: {type: string, format: date-time}
        current_identity: {type: object, additionalProperties: true}
        candidate_status: {type: object, additionalProperties: true}
        workflow: {type: [object, 'null'], additionalProperties: true}
        manager_approval: {type: [object, 'null'], additionalProperties: true}
        paper_pack: {$ref: '#/components/schemas/PaperPack'}
        available_actions: {type: array, items: {$ref: '#/components/schemas/TypedAction'}}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/Diagnostic'}}
        refresh_hints: {$ref: '#/components/schemas/RefreshHints'}
    TypedAction:
      type: object
      additionalProperties: false
      required: [contract_version, code, label, group, enabled, invocation]
      properties:
        contract_version: {const: OFFICE_CANDIDATE_ACTION_V1}
        code: {type: string}
        label: {type: string}
        group: {type: string}
        prominent: {type: boolean}
        enabled: {type: boolean}
        disabled_reason_code: {type: [string, 'null']}
        disabled_reason: {type: [string, 'null']}
        requires_confirmation: {type: boolean}
        requires_reason: {type: boolean}
        invocation:
          type: object
          additionalProperties: false
          required: [version, kind, method, path, fixed_body, required_user_inputs, idempotency]
          properties:
            version: {const: 1}
            kind: {type: string, enum: [HTTP, CLIENT_DESTINATION]}
            method: {type: [string, 'null'], enum: [GET, POST, null]}
            path: {type: string}
            fixed_body: {type: object}
            required_user_inputs: {type: array, items: {type: object}}
            idempotency: {type: string, enum: [NONE, REQUIRED]}
    Diagnostic:
      type: object
      additionalProperties: true
      required: [code, severity, message, calculation_effect]
      properties:
        code: {type: string, enum: [EXPENSE_EMAIL_MISSING]}
        severity: {type: string, enum: [INFO, WARNING, ERROR]}
        message: {type: string}
        calculation_effect: {const: NONE}
    RefreshHints:
      type: object
      additionalProperties: true
      properties:
        refetch: {type: string, enum: [NONE, CURRENT_ROW, AFFECTED_ROWS, CURRENT_SURFACE]}
    PaperPack:
      type: object
      additionalProperties: true
      required: [state]
      properties:
        state: {type: string, enum: [NOT_APPLICABLE, PREPARING, READY, RETURN_RECEIVED, FAILED, RETIRED, STALE]}
        lifecycle_code: {type: [string, 'null']}
        delivery_generation:
          type: [integer, 'null']
          minimum: 1
          description: Immutable PAPER delivery generation. FINALISED workflows use the preceding generation; live preparation uses the current generation.
        page_count: {type: [integer, 'null'], minimum: 1}
        reason_code: {type: [string, 'null']}
        issued_at_utc: {type: [string, 'null'], format: date-time}
        returned_at_utc: {type: [string, 'null'], format: date-time}
    RoutePreview:
      type: object
      additionalProperties: true
      properties:
        intervention_choice:
          type: [object, 'null']
          additionalProperties: false
          required: [required, decision_code, title, message, reject_available, reject_action, continue_action]
          properties:
            required: {const: true}
            decision_code: {const: REJECT_OR_MANUAL}
            title: {const: 'Does the candidate need to resubmit instead?'}
            message: {type: string}
            reject_available: {type: boolean}
            reject_disabled_reason_code: {type: [string, 'null']}
            reject_disabled_reason: {type: [string, 'null']}
            reject_action:
              type: object
              additionalProperties: false
              required: [code, label, method, path]
              properties:
                code: {const: REJECT_CANDIDATE_SUBMISSION}
                label: {const: 'Use Reject Candidate Submission'}
                method: {const: GET}
                path: {type: string}
            continue_action:
              type: object
              additionalProperties: false
              required: [code, label, method, path, fixed_body]
              properties:
                code: {const: CONTINUE_ROUTE_CHANGE}
                label: {const: 'Continue to Manual conversion'}
                method: {const: POST}
                path: {type: string}
                fixed_body:
                  type: object
                  additionalProperties: false
                  required: [action]
                  properties:
                    action: {$ref: '#/components/schemas/RouteAction'}
    RouteConfirmRequest:
      type: object
      additionalProperties: false
      required: [expected_timesheet_id, expected_row_signature, expected_context_sha256, action, idempotency_key]
      properties:
        expected_timesheet_id: {$ref: '#/components/schemas/Uuid'}
        expected_row_signature: {type: string}
        expected_context_sha256: {$ref: '#/components/schemas/Sha256'}
        action: {$ref: '#/components/schemas/RouteAction'}
        reason_code: {type: [string, 'null']}
        reason_note: {type: [string, 'null'], maxLength: 1000}
        allow_manual_only: {type: boolean, default: false}
        idempotency_key: {$ref: '#/components/schemas/Uuid'}
    RejectionPreview:
      type: object
      additionalProperties: true
      required: [contract_version, permitted, context_sha256, expected_timesheet_id, expected_row_signature]
      properties:
        contract_version: {const: OFFICE_CANDIDATE_REJECTION_PREVIEW_V1}
        permitted: {type: boolean}
        context_sha256: {$ref: '#/components/schemas/Sha256'}
        expected_timesheet_id: {$ref: '#/components/schemas/Uuid'}
        expected_row_signature: {type: string}
    RejectionRequest:
      type: object
      additionalProperties: false
      required: [expected_timesheet_id, expected_row_signature, context_sha256, reason, idempotency_key]
      properties:
        expected_timesheet_id: {$ref: '#/components/schemas/Uuid'}
        expected_row_signature: {type: string}
        context_sha256: {$ref: '#/components/schemas/Sha256'}
        reason: {type: string, minLength: 1, maxLength: 1000}
        idempotency_key: {$ref: '#/components/schemas/Uuid'}
    WorkflowActionRequest:
      type: object
      additionalProperties: false
      required: [generation, idempotency_key]
      properties:
        generation: {type: integer, minimum: 1}
        approval_request_id: {$ref: '#/components/schemas/Uuid'}
        approval_request_generation: {type: integer, minimum: 1}
        reason: {type: string, minLength: 1, maxLength: 1000}
        reason_note: {type: string, minLength: 1, maxLength: 1000}
        reason_code: {type: string}
        manifest_sha256_hex: {$ref: '#/components/schemas/Sha256'}
        component_id: {$ref: '#/components/schemas/Uuid'}
        component_sha256_hex: {$ref: '#/components/schemas/Sha256'}
        viewed_receipt: {type: object, additionalProperties: true}
        manager_name: {type: string, minLength: 1, maxLength: 200}
        manager_position: {type: string, minLength: 1, maxLength: 200}
        signature_component_id: {$ref: '#/components/schemas/Uuid'}
        idempotency_key: {$ref: '#/components/schemas/Uuid'}
    ReminderBatchPreviewRequest:
      type: object
      additionalProperties: false
      required: [selected_rows]
      properties:
        selected_rows: {type: array, minItems: 1, maxItems: 100, items: {$ref: '#/components/schemas/Identity'}}
    ReminderBatchExecuteRequest:
      allOf:
        - {$ref: '#/components/schemas/ReminderBatchPreviewRequest'}
        - type: object
          additionalProperties: false
          required: [batch_id, idempotency_key, preview_context_hash, selection_fingerprint]
          properties:
            batch_id: {$ref: '#/components/schemas/Uuid'}
            idempotency_key: {$ref: '#/components/schemas/Uuid'}
            preview_context_hash: {$ref: '#/components/schemas/Sha256'}
            selection_fingerprint: {$ref: '#/components/schemas/Sha256'}
    ReminderBatchPreview:
      type: object
      additionalProperties: true
      required: [ok, contract_version, preview_context_hash, selection_fingerprint, items]
      properties:
        ok: {const: true}
        contract_version: {const: OFFICE_CANDIDATE_REMINDER_BATCH_PREVIEW_V1}
        preview_context_hash: {$ref: '#/components/schemas/Sha256'}
        selection_fingerprint: {$ref: '#/components/schemas/Sha256'}
        items: {type: array, maxItems: 100, items: {type: object, additionalProperties: true}}
    ReminderBatchResult:
      type: object
      additionalProperties: true
      required: [contract_version, batch_id, status, items]
      properties:
        contract_version: {const: OFFICE_CANDIDATE_REMINDER_BATCH_RESULT_V1}
        batch_id: {$ref: '#/components/schemas/Uuid'}
        status: {type: string, enum: [COMPLETED, PARTIAL, FAILED]}
        items: {type: array, maxItems: 100, items: {type: object, additionalProperties: true}}
    Mutation:
      type: object
      additionalProperties: true
      properties:
        contract_version: {type: string, enum: [OFFICE_CANDIDATE_MUTATION_RESULT_V1]}
        affected_rows: {type: array, items: {type: object, additionalProperties: true}}
        refresh_hints: {$ref: '#/components/schemas/RefreshHints'}
    Error:
      type: object
      additionalProperties: false
      required: [ok, error_code, message, retryable, request_id]
      properties:
        ok: {const: false}
        error_code: {$ref: '#/components/schemas/OfficeErrorCode'}
        message: {type: string}
        retryable: {type: boolean}
        request_id: {type: string}
        details: {}
    OfficeErrorCode:
      type: string
      description: Stable office-facing code. The normal backend maps lower-level lifecycle aliases into this catalogue without changing the public Candidate contract.
      x-stable-codes:
        - OFFICE_AUTH_REQUIRED
        - CANDIDATE_OFFICE_PROJECTION_NOT_FOUND
        - CANDIDATE_OFFICE_PROJECTION_IDENTITY_INVALID
        - CANDIDATE_CONTEXT_STALE
        - CANDIDATE_TIMESHEET_MOVED
