

openapi: 3.1.0
info:
  title: CloudTMS Candidate Broker API
  version: 1.0.0-test
  license: {name: ISC, identifier: ISC}
  description: >-
    Versioned TEST contract for the public Candidate/manager broker and its deterministic
    private CloudTMS service mapping. A public /candidate-app/v1 path maps to
    /private/candidate-app/v1; a public /candidate-manager/v1 path maps to
    /private/candidate-manager/v1. The broker alone is browser/native facing.
servers:
  - url: https://candidate-broker.test.invalid
    description: Placeholder only; the approved TEST broker hostname is assigned at deployment.
tags:
  - name: Authentication
    description: Candidate activation, password and rotating session operations.
  - name: Candidate
    description: Candidate-safe account, timesheet and notification reads.
  - name: Workflow
    description: Candidate factual submission, evidence and lifecycle orchestration.
  - name: Manager
    description: Token-bound manager page review, signature, approval and refusal.
security:
  - CandidateAccess: []
x-cloudtms-private-security:
  scheme: HMAC-SHA256 private service signature
  transport: Cloudflare Worker service binding only
  headers:
    - x-cloudtms-service-version
    - x-cloudtms-service-environment
    - x-cloudtms-service-timestamp
    - x-cloudtms-service-nonce
    - x-cloudtms-service-body-sha256
    - x-cloudtms-service-authorization-sha256
    - x-cloudtms-service-headers-sha256
    - x-cloudtms-service-signature
x-standard-responses: &standardResponses
  '200': {$ref: '#/components/responses/Success'}
  '201': {$ref: '#/components/responses/Created'}
  '202': {$ref: '#/components/responses/Accepted'}
  '400': {$ref: '#/components/responses/Error'}
  '401': {$ref: '#/components/responses/Error'}
  '403': {$ref: '#/components/responses/Error'}
  '404': {$ref: '#/components/responses/Error'}
  '409': {$ref: '#/components/responses/Error'}
  '413': {$ref: '#/components/responses/Error'}
  '429': {$ref: '#/components/responses/Error'}
x-accepted-responses: &acceptedResponses
  '202': {$ref: '#/components/responses/Accepted'}
  '400': {$ref: '#/components/responses/Error'}
  '429': {$ref: '#/components/responses/Error'}
x-session-responses: &sessionResponses
  '200': {$ref: '#/components/responses/Session'}
  '400': {$ref: '#/components/responses/Error'}
  '401': {$ref: '#/components/responses/Error'}
  '429': {$ref: '#/components/responses/Error'}
x-binary-responses: &binaryResponses
  '200': {$ref: '#/components/responses/Binary'}
  '401': {$ref: '#/components/responses/Error'}
  '404': {$ref: '#/components/responses/Error'}
  '409': {$ref: '#/components/responses/Error'}
paths:
  /healthz:
    get:
      tags: [Candidate]
      security: []
      operationId: getCandidateBrokerHealth
      summary: Get candidate broker health
      responses: *standardResponses
  /readyz:
    get:
      tags: [Candidate]
      security: []
      operationId: getCandidateBrokerReadiness
      summary: Get candidate broker readiness
      description: Uses a signed service-bound private health request; it does not query Candidate data.
      responses: *standardResponses
  /candidate-app/v1/auth/challenge/start:
    post:
      tags: [Authentication]
      security: []
      operationId: startCandidateChallenge
      summary: Start candidate challenge
      x-cloudtms-private-path: /private/candidate-app/v1/auth/challenge/start
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *acceptedResponses
  /candidate-app/v1/auth/challenge/resend:
    post:
      tags: [Authentication]
      security: []
      operationId: resendCandidateChallenge
      summary: Resend candidate challenge
      x-cloudtms-private-path: /private/candidate-app/v1/auth/challenge/resend
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *acceptedResponses
  /candidate-app/v1/auth/challenge/verify:
    post:
      tags: [Authentication]
      security: []
      operationId: verifyCandidateChallenge
      summary: Verify candidate challenge
      x-cloudtms-private-path: /private/candidate-app/v1/auth/challenge/verify
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-app/v1/auth/password/complete:
    post:
      tags: [Authentication]
      security: []
      operationId: completeCandidatePassword
      summary: Complete candidate password
      x-cloudtms-private-path: /private/candidate-app/v1/auth/password/complete
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *sessionResponses
  /candidate-app/v1/auth/login:
    post:
      tags: [Authentication]
      security: []
      operationId: loginCandidate
      summary: Login candidate
      x-cloudtms-private-path: /private/candidate-app/v1/auth/login
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *sessionResponses
  /candidate-app/v1/auth/refresh:
    post:
      tags: [Authentication]
      security: []
      operationId: refreshCandidateSession
      summary: Refresh candidate session
      x-cloudtms-private-path: /private/candidate-app/v1/auth/refresh
      requestBody: {$ref: '#/components/requestBodies/RefreshBody'}
      responses: *sessionResponses
  /candidate-app/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutCandidate
      summary: Logout candidate
      x-cloudtms-private-path: /private/candidate-app/v1/auth/logout
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-app/v1/account/select-candidate:
    post:
      tags: [Candidate]
      operationId: selectTestCandidate
      summary: Select test candidate
      x-cloudtms-private-path: /private/candidate-app/v1/account/select-candidate
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses:
        '200': {description: Candidate selected; returns a replacement broker access token and the same public session_id, content: {application/json: {schema: {$ref: '#/components/schemas/SelectedCandidateSession'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /candidate-app/v1/account/preferences:
    patch:
      tags: [Candidate]
      operationId: updateCandidateNotificationPreferences
      summary: Update candidate notification preferences
      x-cloudtms-private-path: /private/candidate-app/v1/account/preferences
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-app/v1/account/push-token:
    post:
      tags: [Candidate]
      operationId: registerCandidateDevice
      summary: Register candidate device
      description: The broker encrypts the raw provider token before calling the private API.
      x-cloudtms-private-path: /private/candidate-app/v1/account/push-token
      requestBody: {$ref: '#/components/requestBodies/PushTokenBody'}
      responses: *standardResponses
  /candidate-app/v1/account/password:
    post:
      tags: [Authentication]
      operationId: changeCandidatePassword
      summary: Change candidate password
      x-cloudtms-private-path: /private/candidate-app/v1/account/password
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-app/v1/bootstrap:
    get:
      tags: [Candidate]
      operationId: getCandidateBootstrap
      summary: Get candidate bootstrap
      x-cloudtms-private-path: /private/candidate-app/v1/bootstrap
      responses: *standardResponses
  /candidate-app/v1/timesheets:
    get:
      tags: [Candidate]
      operationId: listCandidateTimesheets
      summary: List candidate timesheets
      x-cloudtms-private-path: /private/candidate-app/v1/timesheets
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses: *standardResponses
  /candidate-app/v1/timesheets/{timesheetId}:
    get:
      tags: [Candidate]
      operationId: getCandidateTimesheet
      summary: Get candidate timesheet
      x-cloudtms-private-path: /private/candidate-app/v1/timesheets/{timesheetId}
      parameters: [{$ref: '#/components/parameters/TimesheetId'}]
      responses: *standardResponses
  /candidate-app/v1/timesheets/{timesheetId}/paper-pack/status:
    get:
      tags: [Candidate]
      operationId: getPaperPackStatus
      summary: Get paper pack status
      x-cloudtms-private-path: /private/candidate-app/v1/timesheets/{timesheetId}/paper-pack/status
      parameters: [{$ref: '#/components/parameters/TimesheetId'}]
      responses: *standardResponses
  /candidate-app/v1/timesheets/{timesheetId}/paper-pack:
    get:
      tags: [Candidate]
      operationId: downloadPaperPack
      summary: Download paper pack
      x-cloudtms-private-path: /private/candidate-app/v1/timesheets/{timesheetId}/paper-pack
      parameters: [{$ref: '#/components/parameters/TimesheetId'}]
      responses:
        '200': {description: Official PDF bytes, content: {application/pdf: {schema: {type: string, contentEncoding: binary}}}}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /candidate-app/v1/timesheets/{timesheetId}/expense-placement:
    post:
      tags: [Workflow]
      operationId: resolveCandidateExpensePlacement
      summary: Resolve candidate expense placement
      x-cloudtms-private-path: /private/candidate-app/v1/timesheets/{timesheetId}/expense-placement
      parameters: [{$ref: '#/components/parameters/TimesheetId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-app/v1/timesheets/{timesheetId}/expense-carrier:
    post:
      tags: [Workflow]
      operationId: resolveOrCreateCandidateExpenseCarrier
      summary: Resolve or create candidate expense carrier
      x-cloudtms-private-path: /private/candidate-app/v1/timesheets/{timesheetId}/expense-carrier
      parameters: [{$ref: '#/components/parameters/TimesheetId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-app/v1/contracts/{contractId}/missing-weeks:
    get:
      tags: [Candidate]
      operationId: listCandidateMissingWeeks
      summary: List candidate missing weeks
      x-cloudtms-private-path: /private/candidate-app/v1/contracts/{contractId}/missing-weeks
      parameters:
        - {$ref: '#/components/parameters/ContractId'}
        - {$ref: '#/components/parameters/FromDate'}
        - {$ref: '#/components/parameters/ToDate'}
      responses: *standardResponses
    post:
      tags: [Workflow]
      operationId: addCandidateMissingWeek
      summary: Add candidate missing week
      x-cloudtms-private-path: /private/candidate-app/v1/contracts/{contractId}/missing-weeks
      parameters: [{$ref: '#/components/parameters/ContractId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-app/v1/notifications:
    get:
      tags: [Candidate]
      operationId: listCandidateNotifications
      summary: List candidate notifications
      x-cloudtms-private-path: /private/candidate-app/v1/notifications
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses: *standardResponses
  /candidate-app/v1/notifications/{notificationId}/read:
    post:
      tags: [Candidate]
      operationId: markCandidateNotificationRead
      summary: Mark candidate notification read
      x-cloudtms-private-path: /private/candidate-app/v1/notifications/{notificationId}/read
      parameters: [{$ref: '#/components/parameters/NotificationId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-app/v1/workflows:
    post:
      tags: [Workflow]
      operationId: createCandidateWorkflow
      summary: Create candidate workflow
      x-cloudtms-private-path: /private/candidate-app/v1/workflows
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-app/v1/workflows/{workflowId}/actions/{action}:
    post:
      tags: [Workflow]
      operationId: transitionCandidateWorkflow
      summary: Transition candidate workflow
      x-cloudtms-private-path: /private/candidate-app/v1/workflows/{workflowId}/actions/{action}
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {name: action, in: path, required: true, schema: {type: string, enum: [amend, worker-submit, select-approval-method, select-phone-approval, create-email-approval-request, paper-prepare, paper-return, remind, renew, cancel-manager-handoff, cancel, supersede, finalise, component-supersede]}}
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-app/v1/workflows/{workflowId}/components/prepare:
    post:
      tags: [Workflow]
      operationId: prepareCandidateComponent
      summary: Prepare candidate component
      x-cloudtms-private-path: /private/candidate-app/v1/workflows/{workflowId}/components/prepare
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-app/v1/uploads/{ticket}:
    put:
      tags: [Workflow]
      operationId: uploadCandidateComponent
      summary: Upload candidate component
      x-cloudtms-private-path: /private/candidate-app/v1/uploads/{ticket}
      parameters:
        - {name: ticket, in: path, required: true, schema: {type: string, maxLength: 32768}}
      requestBody:
        required: true
        content:
          image/png: {schema: {type: string, contentEncoding: binary, maxLength: 15728640}}
          image/jpeg: {schema: {type: string, contentEncoding: binary, maxLength: 15728640}}
          application/pdf: {schema: {type: string, contentEncoding: binary, maxLength: 15728640}}
      responses: *standardResponses
  /candidate-app/v1/workflows/{workflowId}/components/{componentId}/document:
    get:
      tags: [Workflow]
      operationId: streamCandidateWorkflowDocument
      summary: Stream candidate workflow document
      x-cloudtms-private-path: /private/candidate-app/v1/workflows/{workflowId}/components/{componentId}/document
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/ComponentId'}
      responses: *binaryResponses
  /candidate-app/v1/contract-weeks/{contractWeekId}/no-work:
    post:
      tags: [Workflow]
      operationId: markCandidateContractWeekNoWork
      summary: Mark candidate contract week no work
      x-cloudtms-private-path: /private/candidate-app/v1/contract-weeks/{contractWeekId}/no-work
      parameters:
        - {name: contractWeekId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-manager/v1/workflows/{workflowId}/start:
    get:
      tags: [Manager]
      security: [{ManagerToken: []}]
      operationId: startManagerReview
      summary: Start manager review
      description: Email uses the approval bearer token. Same-phone approval uses the broker-sealed PHONE handoff bearer plus x-candidate-session-token and, where bound, x-candidate-device-id.
      x-cloudtms-private-path: /private/candidate-manager/v1/workflows/{workflowId}/start
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      responses: *standardResponses
  /candidate-manager/v1/workflows/{workflowId}/progress:
    post:
      tags: [Manager]
      security: [{ManagerToken: []}]
      operationId: recordManagerReviewProgress
      summary: Record manager review progress
      x-cloudtms-private-path: /private/candidate-manager/v1/workflows/{workflowId}/progress
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-manager/v1/workflows/{workflowId}/signature/prepare:
    post:
      tags: [Manager]
      security: [{ManagerToken: []}]
      operationId: prepareManagerSignature
      summary: Prepare manager signature
      x-cloudtms-private-path: /private/candidate-manager/v1/workflows/{workflowId}/signature/prepare
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-manager/v1/workflows/{workflowId}/approve:
    post:
      tags: [Manager]
      security: [{ManagerToken: []}]
      operationId: approveManagerReview
      summary: Approve manager review
      x-cloudtms-private-path: /private/candidate-manager/v1/workflows/{workflowId}/approve
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-manager/v1/workflows/{workflowId}/refuse:
    post:
      tags: [Manager]
      security: [{ManagerToken: []}]
      operationId: refuseManagerReview
      summary: Refuse manager review
      x-cloudtms-private-path: /private/candidate-manager/v1/workflows/{workflowId}/refuse
      parameters: [{$ref: '#/components/parameters/WorkflowId'}]
      requestBody: {$ref: '#/components/requestBodies/JsonBody'}
      responses: *standardResponses
  /candidate-manager/v1/workflows/{workflowId}/components/{componentId}/document:
    get:
      tags: [Manager]
      security: [{ManagerToken: []}]
      operationId: streamManagerReviewDocument
      summary: Stream manager review document
      x-cloudtms-private-path: /private/candidate-manager/v1/workflows/{workflowId}/components/{componentId}/document
      parameters:
        - {$ref: '#/components/parameters/WorkflowId'}
        - {$ref: '#/components/parameters/ComponentId'}
      responses: *binaryResponses
components:
  securitySchemes:
    CandidateAccess: {type: http, scheme: bearer, bearerFormat: OpaqueBrokerEnvelope}
    ManagerToken: {type: http, scheme: bearer, bearerFormat: OpaqueApprovalToken}
  schemas:
    Uuid: {type: string, format: uuid}
    JsonObject: {type: object, additionalProperties: true}
    Error:
      type: object
      required: [ok, error_code]
      properties:
        ok: {const: false}
        error_code: {type: string}
        request_id: {type: string}
    Session:
      type: object
      required: [ok, access_token, refresh_token, session_id]
      properties:
        ok: {const: true}
        access_token: {type: string, description: Broker-sealed access envelope; never a CloudTMS private token.}
        refresh_token: {type: string, description: Broker-sealed refresh envelope; never a CloudTMS private token.}
        session_id: {type: string, description: Public broker session identity.}
        access_expires_in_seconds: {type: integer}
        absolute_expires_at_utc: {type: string, format: date-time}
    SelectedCandidateSession:
      type: object
      required: [ok, access_token, session_id]
      properties:
        ok: {const: true}
        access_token: {type: string, description: Replacement broker-sealed access envelope.}
        session_id: {type: string, description: Unchanged public broker session identity; the private database session ID is never returned.}
        selected_candidate_id: {$ref: '#/components/schemas/Uuid'}
        access_expires_in_seconds: {type: integer}
  parameters:
    Cursor: {name: cursor, in: query, required: false, schema: {type: string}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    FromDate: {name: from, in: query, required: true, schema: {type: string, format: date}}
    ToDate: {name: to, in: query, required: true, schema: {type: string, format: date}}
    TimesheetId: {name: timesheetId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ContractId: {name: contractId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    WorkflowId: {name: workflowId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    ComponentId: {name: componentId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
    NotificationId: {name: notificationId, in: path, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
  requestBodies:
    JsonBody:
      required: true
      content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}
    RefreshBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refresh_token, session_id]
            properties:
              refresh_token: {type: string}
              session_id: {type: string}
              idempotency_key: {type: string, maxLength: 200}
    PushTokenBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [push_provider, push_token]
            properties:
              push_provider: {type: string, enum: [APNS, FCM, WEB_PUSH]}
              push_token: {type: string, maxLength: 8192}
  responses:
    Error:
      description: Stable public-safe failure.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Success:
      description: Successful canonical response.
      content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}
    Created:
      description: Resource prepared or created.
      content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}
    Accepted:
      description: Durable asynchronous work or enumeration-safe challenge accepted.
      content: {application/json: {schema: {$ref: '#/components/schemas/JsonObject'}}}
    Session:
      description: Public broker session.
      content: {application/json: {schema: {$ref: '#/components/schemas/Session'}}}
    Binary:
      description: Authorised server-streamed document bytes.
      content:
        application/pdf: {schema: {type: string, contentEncoding: binary}}
        image/png: {schema: {type: string, contentEncoding: binary}}
        image/jpeg: {schema: {type: string, contentEncoding: binary}}
