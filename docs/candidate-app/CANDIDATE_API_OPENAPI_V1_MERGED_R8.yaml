components:
  securitySchemes:
    CandidateAccess:
      type: http
      scheme: bearer
      bearerFormat: OpaqueBrokerEnvelope
    ManagerToken:
      type: http
      scheme: bearer
      bearerFormat: OpaqueApprovalToken
    GoogleSystemHmac:
      type: apiKey
      in: header
      name: X-CloudTMS-Signature
      description: One header in the v1 HMAC envelope. Key ID, version, timestamp, nonce, content SHA-256 and correlation
        ID are mandatory. Idempotency-Key is mandatory only for command/effect operations.
  schemas:
    Uuid:
      type: string
      format: uuid
    JsonObject:
      type: object
      additionalProperties: true
    Error:
      type: object
      required:
      - ok
      - error_code
      properties:
        ok:
          const: false
        error_code:
          type: string
        request_id:
          type: string
        details:
          type: object
          description: Public-safe structured details; challenge throttles may include retry_after_seconds and terminal.
          additionalProperties: true
    Session:
      type: object
      required:
      - ok
      - access_token
      - refresh_token
      - session_id
      - access_expires_in_seconds
      - issued_at_utc
      - expires_at_utc
      - absolute_expires_at_utc
      properties:
        ok:
          const: true
        access_token:
          type: string
          description: Broker-sealed access envelope; never a CloudTMS private token.
        refresh_token:
          type: string
          description: Broker-sealed refresh envelope; never a CloudTMS private token.
        session_id:
          type: string
          description: Public broker session identity.
        access_expires_in_seconds:
          type: integer
        issued_at_utc:
          type: string
          format: date-time
          description: Frozen private session issue time used for exact public replay.
        expires_at_utc:
          type: string
          format: date-time
        absolute_expires_at_utc:
          type: string
          format: date-time
    TimesheetActionCode:
      type: string
      enum:
      - ENTER_TIMESHEET
      - ADD_EXPENSES
      - CONTINUE_TIMESHEET
      - CONTINUE_EXPENSE_CLAIM
      - CANCEL_ENTIRE_CLAIM_AND_START_AGAIN
      - DISCARD_EXPENSE_CLAIM
      - SEND_MANAGER_REMINDER
      - REQUEST_APPROVAL_AGAIN
      - DOWNLOAD_PAPER_DOCUMENTS
      - UPLOAD_SIGNED_RETURN
      - REVIEW_AND_RESUBMIT
      - RESUBMIT_TIMESHEET
      - RESUBMIT_TIMESHEET_AND_EXPENSES
      - RESUBMIT_EXPENSE_CLAIM
      - NO_WORK_THIS_WEEK
      - RETRY_FINALISATION
      - REMOVE_EXPENSE
      - WITHDRAW_EXPENSE
      - CANCEL_EXPENSE
      - WITHDRAW_ENTIRE_CLAIM
      - CANCEL_ENTIRE_CLAIM
      - BEGIN_EXPENSE_UPDATE
      - ABORT_EXPENSE_UPDATE
      - RESUBMIT_EXPENSE_CATEGORY
      - CREATE_UPDATED_DOCUMENTS
    TimesheetAvailableAction:
      type: object
      required:
      - code
      - label
      - requires_confirmation
      - enabled
      - invocation
      properties:
        code:
          $ref: '#/components/schemas/TimesheetActionCode'
        label:
          type: string
        method:
          type:
          - string
          - 'null'
          enum:
          - GET
          - POST
          - null
        path:
          type:
          - string
          - 'null'
        requires_confirmation:
          type: boolean
        requires_reason:
          type: boolean
          default: false
        enabled:
          type: boolean
        disabled_reason:
          type:
          - string
          - 'null'
        workflow_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        workflow_generation:
          type:
          - integer
          - 'null'
          minimum: 1
        approval_request_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        timesheet_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        contract_week_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        invocation:
          $ref: '#/components/schemas/TimesheetActionInvocation'
    TimesheetActionInvocation:
      type: object
      required:
      - version
      - kind
      properties:
        version:
          const: 1
        kind:
          type: string
          enum:
          - HTTP
          - CLIENT_DESTINATION
        method:
          type:
          - string
          - 'null'
          enum:
          - GET
          - POST
          - null
        path:
          type:
          - string
          - 'null'
        destination:
          type:
          - string
          - 'null'
          enum:
          - TIMESHEET_EDITOR
          - EXPENSE_CLAIM_EDITOR
          - null
