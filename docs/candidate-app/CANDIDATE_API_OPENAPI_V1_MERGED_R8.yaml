  /candidate-app/v1/bootstrap:
    get:
      tags:
      - Candidate Daily
      operationId: getCandidateBootstrap
      summary: Existing bootstrap with Daily capability addition
      description: Preserves the accepted bootstrap result and entitlements.daily meaning. capabilities.daily_availability.enabled
        is the sole new-product surface signal and uses CANDIDATE_SURFACE policy. Legacy compatibility and signed-system continuity
        do not consult that signal or candidate_daily_enabled.
      x-cloudtms-private-path: /private/candidate-app/v1/bootstrap
      responses:
        '200':
          description: Accepted bootstrap plus additive Daily capability.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateBootstrapR5'
        '401':
          description: Authentication, signed-adapter authority, or immutable source proof failed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DailyError'
                - oneOf:
                  - type: object
                    properties:
                      error_code:
                        const: UNAUTHENTICATED
                      retry_class:
                        const: REAUTHENTICATE
                    required:
                    - error_code
                    - retry_class
                description: Closed R5 error union for getCandidateBootstrap HTTP 401.
        '429':
          description: Bounded route limit exceeded.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DailyError'
                - oneOf:
                  - type: object
                    properties:
                      error_code:
                        const: RATE_LIMITED
                      retry_class:
                        const: RETRY_AFTER
                    required:
                    - error_code
                    - retry_class
                description: Closed R5 error union for getCandidateBootstrap HTTP 429.
        '500':
          description: Unexpected server failure; command callers must status-check when specified.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DailyError'
                - oneOf:
                  - type: object
                    properties:
                      error_code:
                        const: INTERNAL_ERROR
                      retry_class:
                        const: RETRY_AFTER
                    required:
                    - error_code
                    - retry_class
                description: Closed R5 error union for getCandidateBootstrap HTTP 500.
        '503':
          description: Required authority, reader key, or retained dependency is unavailable.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/DailyError'
                - oneOf:
                  - type: object
                    properties:
                      error_code:
                        const: DEPENDENCY_UNAVAILABLE
                      retry_class:
                        const: RETRY_AFTER
                    required:
                    - error_code
                    - retry_class
                description: Closed R5 error union for getCandidateBootstrap HTTP 503.
      x-cloudtms-route-class: BASELINE_COMPAT
      x-cloudtms-errors:
      - status: 401
        error_code: UNAUTHENTICATED
        retry_class: REAUTHENTICATE
      - status: 429
        error_code: RATE_LIMITED
        retry_class: RETRY_AFTER
      - status: 500
        error_code: INTERNAL_ERROR
        retry_class: RETRY_AFTER
      - status: 503
        error_code: DEPENDENCY_UNAVAILABLE
        retry_class: RETRY_AFTER
      parameters:
      - $ref: '#/components/parameters/CandidateCorrelationId'
      x-cloudtms-access-policy: BASELINE_BOOTSTRAP
  /candidate-app/v1/timesheets:
    get:
      tags:
      - Candidate
      operationId: listCandidateTimesheets
      summary: List candidate timesheets
      description: Current is the default and contains every non-future unpaid record plus records paid at or after the frozen
        snapshot's seven-day cutoff. History contains only records paid before that cutoff whose week ending falls within
        the contract's effective current week plus the preceding 15 weeks. The two views never overlap. Both use newest week
        ending first and a v2 cursor bound to view, candidate and frozen snapshot.
      x-cloudtms-private-path: /private/candidate-app/v1/timesheets
      parameters:
      - $ref: '#/components/parameters/TimesheetView'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Candidate timesheet page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
