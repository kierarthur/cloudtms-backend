openapi: 3.1.0
info:
  title: CloudTMS Candidate Broker API - accepted baseline plus Candidate Daily R8
  version: 1.0.0-test+phase2-phase1b-r8
  license:
    name: ISC
    identifier: ISC
  description: Versioned TEST contract for the public Candidate/manager broker and its deterministic private CloudTMS service
    mapping. A public /candidate-app/v1 path maps to /private/candidate-app/v1; a public /candidate-manager/v1 path maps to
    /private/candidate-manager/v1. The broker alone is browser/native facing. Candidate Daily Phase 2 database authority and
    Phase 1B broker-to-RPC integration are implemented but remain globally disabled and data-empty; Google specialist adapters,
    Candidate clients, entitlement/cutover activation and production rollout remain later gated phases.
x-cloudtms-phase-implementation:
  phase0-r5: accepted
  phase1a-r7: implemented-and-independently-accepted
  phase2-r8: implemented-test-only-disabled
  phase1b-r8: implemented-test-only-disabled
  google-adapters-phase3: not-implemented
  candidate-clients-phase4: not-implemented
  feature-activation: prohibited
  database-authority:
    additive-tables: 12
    service-rpcs: 13
    direct-browser-database-access: false
    candidate-daily-enabled-default: false
servers:
- url: https://candidate-broker.test.invalid
  description: Placeholder only; the approved TEST broker hostname is assigned at deployment.
tags:
- name: Authentication
  description: Candidate activation, password and rotating session operations.
- name: Candidate
  description: Candidate-safe account, timesheet and notification reads.
- name: Workflow
  description: Candidate factual submission, evidence and lifecycle orchestration.
- name: Manager
  description: Token-bound manager page review, signature, approval and refusal.
- name: Candidate Daily
- name: Google Availability System
security:
- CandidateAccess: []
x-cloudtms-private-security:
  scheme: HMAC-SHA256 private service signature
  transport: Cloudflare Worker service binding only
  headers:
  - x-cloudtms-service-version
  - x-cloudtms-service-environment
  - x-cloudtms-service-timestamp
  - x-cloudtms-service-nonce
  - x-cloudtms-service-body-sha256
  - x-cloudtms-service-authorization-sha256
  - x-cloudtms-service-headers-sha256
  - x-cloudtms-service-signature
