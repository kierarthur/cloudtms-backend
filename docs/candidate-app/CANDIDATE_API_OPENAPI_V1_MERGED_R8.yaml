      summary: Resend candidate challenge
      description: A successful 202 means the resend operation was durably accepted. A resend attempted before the 60-second
        boundary returns CANDIDATE_CHALLENGE_RESEND_TOO_SOON as 429 with Retry-After. Exhausted resend allowance returns CANDIDATE_CHALLENGE_RESEND_LIMIT
        as a terminal 429. Either throttle consumes its idempotency key; an exact replay returns the same throttle and a later
        attempt requires a new key.
      x-cloudtms-private-path: /private/candidate-app/v1/auth/challenge/resend
      requestBody:
        $ref: '#/components/requestBodies/IdempotentJsonBody'
