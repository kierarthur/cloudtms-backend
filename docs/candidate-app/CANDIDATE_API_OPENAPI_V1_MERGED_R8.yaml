x-cloudtms-r5-baseline:
  path: CANDIDATE_API_OPENAPI_V1_BASELINE_PINNED.yaml
  merge_rule: Only GET /candidate-app/v1/bootstrap is an allowed replacement; all other baseline operations remain equal in
    parsed form.
x-cloudtms-route-classes:
  BASELINE_COMPAT: Accepted Candidate route shape is preserved; bootstrap adds one composed capability fragment. No replay
    field is added.
  CANDIDATE_DAILY_READ: Candidate-bound read. No Idempotency-Key and no replay body/header.
  CANDIDATE_DAILY_COMMAND: Candidate-bound command. Idempotency-Key and X-Idempotent-Replay response header are mandatory;
    the stored body is byte-stable.
  GOOGLE_SYSTEM_READ: Signed system read. Correlation is supplied, signed, validated and never replaced.
  GOOGLE_SYSTEM_COMMAND: Signed system command. Correlation and idempotency are supplied, signed and never replaced; exact
    body replay is receipt-owned.
x-cloudtms-correlation-rules:
  candidate_routes: Absent or invalid X-Correlation-Id is replaced with a valid server ULID before authentication or authority
    processing.
  signed_system_routes: X-Correlation-Id is mandatory, ULID-valid, included in HMAC canonical bytes and never replaced.
x-cloudtms-access-policies:
  BASELINE_BOOTSTRAP: Existing authenticated bootstrap remains callable. It reports the new Daily capability but is not itself
    gated by candidate_daily_enabled.
  CANDIDATE_SURFACE: Requires exact global true, explicit environment entitlement, server-derived candidate/source binding,
    and current authority readiness.
  LEGACY_COMPAT: Contains the temporary legacy browser unchanged behind its existing Apps Script handler and does not consult
    the new-product global switch. Only the trusted Apps Script server may call this compatibility boundary. Requests require
    HMAC, nonce, trusted environment, stable adapter operation identity, and an approved legacy-source mapping that CloudTMS
    resolves independently to one Candidate. The browser receives no CloudTMS token and cannot nominate a Candidate UUID.
  SIGNED_SYSTEM_SYNC: Preserves signed Google generation, projection, reconciliation, and effect continuity without consulting
    the new-product global switch. Requires HMAC, nonce, source/effect readiness, authority mode, and transition state.
